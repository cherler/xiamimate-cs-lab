<!doctype html>
<html lang="zh"><head><meta charset="utf-8"/>
<title>算法卡牌 · 原型 v12</title>
<style>html,body{margin:0;height:100%;background:#070d16;overflow:hidden;
font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;color:#dfe8f2}
#c{display:block;width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas>
<script type="module">
/* ═══ 1. 调参 ═══ */
let PASSMUL=13  // 有序度换成严格口径后(相等的相邻柱不算有序),冒泡换不动相等对,
                // 排序引擎整体变钝 —— 趟数从 6 补到 11 才回到原来的手感   // 实测:×2→sort 2.5% / ×6→41.5% / ×8→51.5%
const T={VMIN:3,VMAX:20,BUDGET:60,STEPS:3,HAND:5,COST_DIV:6,DEBT_PEN:2,HANDMAX:9}
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

/* ═══ 2. 敌人:性质决定哪些算法好用 ═══ */
const FOE={
 shuffled:{n:36,shape:'random',inflow:1,shuffle:1,name:'一团乱序数字',note:'每回合涌入 +1、自我打乱(有序 −1)',kind:'小怪'},
 tape:    {n:38,shape:'nearly',inflow:1,shuffle:0,seqOnly:.7,name:'只能从头读的磁带',note:'顺序访问:二分查找效果打七折',kind:'小怪'},
 dupes:   {n:40,shape:'heavy',inflow:2,shuffle:0,vmax:8,name:'爬虫抓回来的重复页',note:'值域窄、量大:平铺处理占便宜',kind:'小怪'},
 stream:  {n:38,shape:'tail',inflow:2,shuffle:1,memoDecay:6,name:'实时价格流',note:'数据在变:预处理值每回合 −6',kind:'小怪'},
 graph:   {n:38,shape:'sparse',inflow:1,shuffle:0,dense:.5,name:'社交网络的六度关系',note:'稠密:每多切两段,每回合多涌入 1',kind:'小怪'},
 // 对抗性输入(精英):专门克制某一条流派
 worst:   {n:50,shape:'reversed',inflow:1,shuffle:0,antiSort:1,name:'最坏用例',note:'完全倒序 + 排序卡趟数打五五折 —— 有序度要从零建起',kind:'精英'},
 collide: {n:42,shape:'heavy',inflow:1,shuffle:0,evict:1,name:'哈希碰撞',note:'通用:每回合末随机丢 1 张手牌(键撞了,取不回来)',kind:'精英'},
 regret:  {n:41,shape:'nearly',inflow:1,shuffle:0,antiGreedy:1,name:'反悔陷阱',note:'专克贪心流:债务惩罚 ×2.2',kind:'精英'},
 explode2:{n:42,shape:'random',inflow:1,shuffle:0,memoCap:20,name:'状态爆炸',note:'专克预处理流:预处理值上限 20',kind:'精英'},
 atomic:  {n:45,shape:'blocks',inflow:1,shuffle:0,noSplit:2,name:'不可分问题',note:'专克拆解流:段数上限 2、并行处理只剩四成',kind:'精英'},
 // Boss
}
/* 第二类 · 失误:攻击的是「你的执行」,不是提供可被处理的对象 → 环境效果 */
const FLAW={
 offByOne:{name:'差一错误', note:'移除 ≥6 时 −1 个、处理量 −10%(边界都差一格)'},
 nullPtr: {name:'空指针',   note:'每回合随机一张手牌不可用'},
 race:    {name:'竞态条件', note:'你出的平铺类卡有 25% 概率只生效一半(顺序乱了)'},
 leak:    {name:'内存泄漏', note:'每回合末额外 −1 预算'},
 stackOv: {name:'栈溢出',   note:'段数 ≥3 时每回合末额外 −2 预算'},
 infinite:{name:'死循环',   note:'每三回合有一回合的第一张卡只生效 70%,除非出「边界条件」'},
}
const FOE2={
 expo:    {n:22,shape:'random',mult:1.35,shuffle:0,name:'指数爆炸',note:'每回合末规模 ×倍率 — 加输出没用,得剪枝降阶',kind:'Boss'},
}
Object.assign(FOE,FOE2)
/* ═══ 3. 卡池 ═══ */
const C={},def=(id,name,cost,tag,note,fn,ex)=>C[id]={id,name,cost,tag,note,fn,exhaust:!!ex}
def('scan','遍历',1,'base','16 点处理量,平均分给每个元素',S=>workTotal(S,16))
def('batch','批处理',1,'base','预算 +5',S=>{S.budget+=5})
def('watch','观察',1,'base','抽 2',S=>drawN(S,2))
def('bubble','冒泡排序',1,'sort','有序 +1',S=>addSort(S,S.E.antiSort?ASORT:1))
def('merge','归并排序',2,'sort','有序 +3',S=>addSort(S,S.E.antiSort?ASORT*3:3))
def('quick','快速排序',2,'sort','有序 +4(最坏用例下只 +1)',S=>{if(S.E.antiSort)S.diag.lostSort+=3;addSort(S,S.E.antiSort?ASORT*4:4)})
def('bsearch','二分查找',1,'sort','移除 1+有序层数×2 个(顺序访问下打七折)',S=>{const full=1+tier(S)*2,act=S.E.seqOnly?Math.max(1,Math.round(full*S.E.seqOnly)):full;S.diag.lostKill+=full-act;kill(S,act)})
/* 插入排序的趟数正比于逆序对数量:几乎有序 → 一趟排完;倒序 → 退化成 O(n²)。
   这正是「笨办法有时更快」那一课,而且它是「几乎有序」这个形状的唯一解法。 */
def('insertion','插入排序',2,'sort','有序度 ≥50% 时【一次排完】;否则只 +1 层(逆序对太多,退化)',
  S=>{const a=alive(S)
   if(sortedness(S)>=.5){const vs=a.map(b=>b.v).sort((x,y)=>x-y);a.forEach((b,i)=>b.v=vs[i])}
   else addSort(S,S.E.antiSort?ASORT:1)})
def('counting','计数排序',2,'sort','按值分桶:移除所有【值 ≤ 最矮+2】的元素 —— 值域越窄清得越多',
  S=>{const a=alive(S);if(!a.length)return
   const mn=Math.min(...a.map(b=>b.v)),cut=mn+2
   a.forEach(b=>{if(b.v<=cut)b.dead=true})})
def('topk','取前 K 大',2,'tool','建堆取 Top-K:移除最高的 3 根 —— 长尾数据一刀砍掉大头',
  S=>{const a=alive(S).slice().sort((x,y)=>y.v-x.v)
   for(let i=0;i<Math.min(3,a.length);i++)a[i].dead=true},1)
def('median','中位数',2,'sort','需有序≥3:移除 1/3 元素',S=>{if(tier(S)>=3)kill(S,Math.ceil(N(S)/3))},1)
def('recur','递归到底',2,'dc','需段数≥3:移除 1/3 元素',S=>{if(S.splits>=3)kill(S,Math.ceil(N(S)/3))},1)
def('divide','分治',2,'dc','段数 +1(最多 4)',S=>{S.splits=Math.min(S.E.noSplit??4,S.splits+1)})
def('mergeup','逐层合并',1,'dc','每段移除 2 个',S=>killSeg(S,2))
def('parallel','并行处理',2,'dc','段数×14 点处理量,平均分给每个元素(不可分下只剩四成)',S=>workTotal(S,S.splits*14*(S.E.noSplit?PARCUT:1)))
def('pre','预处理',1,'memo','预处理值 +8',S=>{const b=S.memo;addMemo(S,8);S.diag.lostMemo+=8-(S.memo-b)})
def('table','建表',2,'memo','预处理值 + 10+规模/4',S=>{const g=10+Math.ceil(N(S)/4),b=S.memo;addMemo(S,g);S.diag.lostMemo+=g-(S.memo-b)})
def('lookup','查表',0,'memo','处理量 = 预处理值,平均分给每个元素;不消耗预处理值',S=>workTotal(S,S.memo))
def('dp','动态规划',2,'memo','处理量 = 预处理值×2,平均分给每个元素',S=>workTotal(S,S.memo*2))
def('approx','近似算法',2,'greedy','移除 1/4 元素,债务 +3',S=>{kill(S,Math.ceil(N(S)/4));S.debt+=3},1)
def('greedy','贪心',0,'greedy','移除 2 个,债务 +1',S=>{kill(S,2);S.debt++})
def('local','局部最优',1,'greedy','移除 5 个,债务 +2',S=>{kill(S,5);S.debt+=2})
def('heur','启发式',1,'greedy','移除 2+债务 个(债务按 6 封顶)',S=>kill(S,2+Math.min(S.debt,6)))
def('anneal','模拟退火',2,'greedy','移除 债务×2 个,清空债务',S=>{kill(S,S.debt*2);S.debt=0})
/* ── 对自己的牌库用算法 ──
   抽牌是 draw.pop(),取的是数组末尾 —— 所以「先抽到」= 排在末尾。 */
def('sortdeck','整理牌库',1,'deck','牌库按费用排序 —— 接下来先抽到便宜的',
  S=>{S.draw.sort((a,b)=>C[b].cost-C[a].cost)})
def('fetch','按需检索',1,'deck','从牌库里直接翻出最贵的一张到手上',
  S=>{if(!S.draw.length||S.hand.length>=T.HANDMAX)return
   let bi=0;for(let i=1;i<S.draw.length;i++)if(C[S.draw[i]].cost>C[S.draw[bi]].cost)bi=i
   S.hand.push(S.draw.splice(bi,1)[0])})
def('prefetch','预读',0,'deck','看牌库顶 3 张,最贵的一张进手,其余放回',
  S=>{const top=S.draw.splice(-3);if(!top.length)return
   let bi=0;for(let i=1;i<top.length;i++)if(C[top[i]].cost>C[top[bi]].cost)bi=i
   if(S.hand.length<T.HANDMAX)S.hand.push(top.splice(bi,1)[0])
   S.draw.push(...top)})
let HEAPCUT=6   // 堆自动弹出的高度门槛
let PREFIX=1.15 // 前缀和对摊平类的放大
let SHUFMUL=1   // 同上:严格口径下每次打乱的破坏力变大,强度要下调
let ASORT=.3,PARCUT=.4,AGREED=2.2   // 精英的专克强度,留成变量方便扫参
def('memoize','复用上一步',1,'deck','立刻重放你这回合打出的上一张牌',
  S=>{const id=S.lastPlayed;if(id)C[id].fn(S)},1)
def('compress','压缩',1,'deck','弃牌堆立刻洗回牌库,再抽 1',
  S=>{if(S.discard.length){S.draw.push(...S.discard);S.discard=[];shuffle(S)}drawN(S,1)})
/* ── 流派五 · 堆(优先队列)。新动词:留在场上持续生效 ──
   前面所有卡都是「打完就没了」。堆建起来之后每回合自动干活,不占你的步数。 */
def('buildheap','建堆',2,'heap','建立最小堆:此后每回合末自动弹出 1 个高度 ≤6 的元素',
  S=>{S.heapLv=Math.max(S.heapLv||0,1)})
def('heapify','堆化',1,'heap','最小堆每回合多弹出 1 个(上限 3;要先建堆)',
  S=>{if(S.heapLv)S.heapLv=Math.min(3,S.heapLv+1)})
def('poptop','弹出堆顶',1,'heap','立刻移除最矮的 2 根',
  S=>{const a=alive(S).slice().sort((x,y)=>x.v-y.v)
   for(let i=0;i<Math.min(2,a.length);i++)a[i].dead=true})
def('heapsort','堆排序',2,'heap','有序 +2,并且立刻移除最矮的 2 根',
  S=>{addSort(S,S.E.antiSort?ASORT*2:2)
   const a=alive(S).slice().sort((x,y)=>x.v-y.v)
   for(let i=0;i<Math.min(2,a.length);i++)a[i].dead=true})
def('medstream','中位数流',2,'heap','移除所有【严格低于中位数】的元素',
  S=>{const a=alive(S);if(!a.length)return
   const vs=a.map(b=>b.v).sort((x,y)=>x-y),med=vs[vs.length>>1]
   a.forEach(b=>{if(b.v<med)b.dead=true})},1)

/* ── 流派六 · 双指针(区间)。新动词:一次处理连续的一段 ──
   前面所有卡要么打全体、要么打「前 N 个」。这条流派按【位置】操作。 */
def('twoptr','两端逼近',1,'twop','从最左和最右各移除 2 根',
  S=>{const a=alive(S)
   for(let i=0;i<Math.min(2,a.length);i++)a[i].dead=true
   for(let i=0;i<Math.min(2,a.length);i++)a[a.length-1-i].dead=true})
def('window','滑动窗口',1,'twop','移除连续的 3 根(从最左开始)',
  S=>{const a=alive(S);for(let i=0;i<Math.min(3,a.length);i++)a[i].dead=true})
def('prefix','前缀和',2,'twop','建立前缀和:此后所有【摊平类】卡的处理量 +15%',
  S=>{S.prefix=true})
def('diff','差分数组',1,'twop','连续 6 根各降低 4 点',
  S=>{const a=alive(S);for(let i=0;i<Math.min(6,a.length);i++){a[i].v-=4;if(a[i].v<=0)a[i].dead=true}})
def('merge2','区间合并',2,'twop','相邻等高的柱子合并 —— 重复越多清得越多',
  S=>{const a=alive(S);let c=0
   for(let i=1;i<a.length;i++)if(a[i].v===a[i-1].v&&!a[i-1].dead){a[i].dead=true;c++}
   return c})
def('monoq','单调队列',2,'twop','此后每回合末保留 1 张手牌,不进弃牌堆',
  S=>{S.monoq=true})

def('prune','剪枝',1,'tool','增长倍率 −0.25;涌入 −1',S=>{S.mult=Math.max(1,S.mult-.25);S.inflow=Math.max(0,S.inflow-1)})
def('backtrack','回溯',2,'tool','预算 +12(每场限一次)',S=>{S.budget+=12},1)
def('guard','边界条件',1,'tool','解除死循环;本回合免疫失误',S=>{S.guarded=true;S.loopBroken=true})
def('hash','哈希',1,'tool','抽 1;移除 2 个',S=>{drawN(S,1);kill(S,2)})

/* 起始牌组 v12:原来四条流派共用 遍历×5 + 批处理×4 + 观察×1 —— 9/10 张只有两种效果,
   而「观察」实测在三条流派里一次都没出过。
   改成每条流派各有起手牌(杀戮尖塔的做法),顺便让四条路一开局就不一样。
   注意:牌库操作卡本质上等于精简牌组(提升抽牌质量),加它们必须同时加强敌人。 */
const STARTERS={
 base:  ['scan','scan','scan','scan','scan','batch','batch','batch','batch','watch'],
 sort:  ['scan','scan','scan','scan','batch','batch','batch','batch','prefetch','sortdeck'],
 dc:    ['scan','scan','scan','batch','batch','batch','batch','prefetch','memoize','sortdeck'],
 memo:  ['scan','scan','scan','batch','batch','batch','batch','prefetch','memoize','sortdeck'],
 greedy:['scan','scan','scan','scan','batch','batch','batch','batch','prefetch','memoize'],
 heap:  ['scan','scan','scan','batch','batch','batch','batch','prefetch','memoize','sortdeck'],
 twop:  ['scan','scan','scan','batch','batch','batch','batch','prefetch','memoize','sortdeck'],
}
const starterOf=k=>STARTERS[k]||STARTERS.base
const KITS={base:[],sort:['insertion','merge','quick','bsearch','counting','median'],
 dc:['divide','divide','mergeup','mergeup','parallel','recur'],
 memo:['pre','pre','table','lookup','lookup','dp'],
 greedy:['greedy','local','heur','heur','anneal','approx'],
 heap:['buildheap','heapify','poptop','heapsort','medstream','poptop'],
 twop:['twoptr','window','prefix','diff','merge2','monoq']}
const DECKCARDS=['sortdeck','fetch','prefetch','memoize','compress']
const REWARD_POOL=[...new Set([...KITS.sort,...KITS.dc,...KITS.memo,...KITS.greedy,...KITS.heap,...KITS.twop]),
 ...DECKCARDS,'prune','prune','prune','prune','backtrack','hash','guard','guard','topk','topk']

/* ═══ 4. 战斗引擎 ═══ */
const alive=S=>S.bars.filter(b=>!b.dead),N=S=>alive(S).length
/* 只数【严格】的顺序对。相等的相邻柱不提供任何顺序信息 ——
   把 a[i]<=a[i+1] 算成有序会让倒序数组显示 59% 有序、
   让稀疏和重复值扎堆的数据白白把二分查找喂满。 */
function sortedness(S){const a=alive(S);if(a.length<2)return 1
 let up=0,down=0
 for(let i=0;i<a.length-1;i++){const d=a[i+1].v-a[i].v;if(d>0)up++;else if(d<0)down++}
 if(!up&&!down)return .5
 return Math.max(0,Math.min(1,(up/(up+down)-.5)*2))}
const tier=S=>Math.floor(sortedness(S)*4.999)
function shuffle(S){for(let i=S.draw.length-1;i>0;i--){const j=Math.floor(S.R()*(i+1));[S.draw[i],S.draw[j]]=[S.draw[j],S.draw[i]]}}
function drawN(S,n){for(let i=0;i<n;i++){if(S.hand.length>=T.HANDMAX)return
 if(!S.draw.length){if(!S.discard.length)return;S.draw=S.discard;S.discard=[];shuffle(S)}
 S.hand.push(S.draw.pop())}}
function work(S,per){alive(S).forEach(b=>{b.v-=per;if(b.v<=0)b.dead=true})}
function workTotal(S,tot){if(S.prefix)tot*=PREFIX
 if(S.halfNext)tot*=.7
 if(S.flawId==='offByOne'&&!S.guarded){S.diag.flawLoss+=tot*.1;tot*=.9}
 const a=alive(S);if(!a.length)return;const per=tot/a.length
 a.forEach(b=>{b.v-=per;if(b.v<=0)b.dead=true})}
function kill(S,n){if(S.halfNext)n=Math.ceil(n*.7)
 if(S.flawId==='offByOne'&&!S.guarded&&n>=6){S.diag.flawLoss+=1;n-=1}
 const a=alive(S);for(let i=0;i<Math.min(n,a.length);i++)a[i].dead=true}
function killSeg(S,n){const a=alive(S),seg=Math.ceil(a.length/S.splits)
 for(let s=0;s<S.splits;s++)for(let i=0;i<n;i++){const b=a[s*seg+i];if(b)b.dead=true}}
function addSort(S,n){const a=alive(S)
 const P=Math.round(n*PASSMUL);for(let pass=0;pass<P;pass++)
  for(let i=0;i<a.length-1;i++)
   if(a[i].v>a[i+1].v){const t=a[i].v;a[i].v=a[i+1].v;a[i+1].v=t}}
function addMemo(S,n){S.memo=Math.min(S.E.memoCap??999,S.memo+n)}
let FLAWBONUS=4    // 挂失误的关卡补多少预算。实测:+10 时失误反而是净收益 +7.9 点(方向反了),
                   // +5 中性,+3 净惩罚 5 点。取 4 —— 既不判死,也确实更难
let DEPTHMUL=.085  // 每深一关:规模 +8.5%(唯一的连续难度轴)
/* 十一个敌人以前共用一行 `v = 3 + random(vmax-2)` —— 名字讲了十一种数据,形状只有一种。
   形状不只是好看:它决定哪一类卡划算。几乎有序的数组不该再排序,
   稀疏的数据一次摊平就能清一大片,长尾的工作量集中在少数几根上。 */
const SHAPES={
 random:{name:'均匀随机',hint:'没有可利用的结构 —— 老老实实排序或摊平',
  gen(n,vmax,R,VMIN){return Array.from({length:n},()=>VMIN+Math.floor(R()*(vmax-VMIN+1)))}},
 nearly:{name:'几乎有序',hint:'已经差不多排好了 —— 别再花回合排序,直接查找',
  gen(n,vmax,R,VMIN){const a=Array.from({length:n},(_,i)=>VMIN+Math.round(i*(vmax-VMIN)/(n-1)))
   for(let k=0;k<Math.max(2,Math.floor(n/12));k++){const i=Math.floor(R()*n),j=Math.floor(R()*n)
    const t=a[i];a[i]=a[j];a[j]=t}
   return a}},
 reversed:{name:'完全倒序',hint:'最坏用例 —— 有序度为零,排序要从头做起',
  gen(n,vmax,R,VMIN){return Array.from({length:n},(_,i)=>vmax-Math.round(i*(vmax-VMIN)/(n-1)))}},
 blocks:{name:'分块有序',hint:'每一段内部是好的,乱的是段与段之间 —— 分治的天堂',
  gen(n,vmax,R,VMIN){const a=[],B=8
   for(let s2=0;s2<n;s2+=B){const seg=[]
    for(let i=0;i<Math.min(B,n-s2);i++)seg.push(VMIN+Math.floor(R()*(vmax-VMIN+1)))
    seg.sort((x,y)=>x-y);a.push(...seg)}
   return a}},
 tail:{name:'长尾',hint:'少数几根扛着大部分工作量 —— 摊平型很亏',
  gen(n,vmax,R,VMIN){return Array.from({length:n},()=>

const BUDGET_GROW=3   // 每过一关预算上限 +3:玩家侧的成长

function newRun(seed,kit){const R=rng(seed)

   used:[],opts:null,log:[]}}
const FLAWIDS=Object.keys(FLAW)
function nodeFlaw(RUN,i){ if(i<1)return null              // 第 1 关不挂失误

function pickFoe(R,pool,used){const av=pool.filter(x=>!used.includes(x))

/* ═══ 6. 批量模拟 ═══ */
const POL={

   return tier(S)>=3?pick(S,['median','bsearch','counting','quick','merge','insertion','scan','hash','batch'])

                   :pick(S,['table','pre','lookup','scan','hash','batch']),

  const i=S.hand.indexOf('memoize');if(i>=0&&canPlay(S,i))return i}       // 刚出完大牌,立刻复用

  if(i>=0&&canPlay(S,i))return i}                                          // 牌库空了,压缩回冲

  const i=S.hand.indexOf(d);if(i>=0&&canPlay(S,i))return i}}               // 手牌少了就去牌库拿

 {const a=alive(S)
  if(a.length){const mn=Math.min(...a.map(b=>b.v))

   const t=a.slice().sort((x,y)=>y.v-x.v)
   if(t.length>3&&t[0].v>=t[Math.floor(t.length/2)].v*2.4){const i=S.hand.indexOf('topk');if(i>=0&&canPlay(S,i))return i}}}
 if(S.mult>1){const i=S.hand.indexOf('prune');if(i>=0&&canPlay(S,i))return i}
 if(S.budget<14){const i=S.hand.indexOf('backtrack');if(i>=0&&canPlay(S,i))return i}
 for(const id of order){const i=S.hand.indexOf(id);if(i>=0&&canPlay(S,i))return i}

function fight(kit,seed,foeId,deck,budget,maxTurn=45,flawId,depth=0){

/* ═══ 6.5 A:进关前情报 · 牌组适配度 ═══ */
const PROPS=[
 {k:'seqOnly', txt:'顺序访问:二分查找效果打七折',      hit:d=>cnt(d,'bsearch'),                 dir:-1},
 {k:'shuffle', txt:e=>`自我打乱:有序度每回合 −${e.shuffle} 层`, hit:d=>cnt(d,'bubble','merge','quick'), dir:-1},
 {k:'antiSort',txt:'最坏用例:快速排序只 +1 有序',    hit:d=>cnt(d,'quick'),                   dir:-1},
{k:'evict',    txt:'每回合末随机丢 1 张手牌',              hit:d=>d.length,                         dir:-1},
 {k:'memoCap', txt:e=>`预处理值上限 ${e.memoCap}`,    hit:d=>cnt(d,'pre','table'),             dir:-1},
 {k:'memoDecay',txt:e=>`预处理值每回合 −${e.memoDecay}`,hit:d=>cnt(d,'pre','table','lookup','dp'),dir:-1},
 {k:'antiGreedy',txt:'债务惩罚翻倍(每点 −4 预算)',   hit:d=>cnt(d,'greedy','local','heur','anneal'),dir:-1},
 {k:'dense',   txt:'稠密:每多切一段,每回合多涌入 1', hit:d=>cnt(d,'divide'),                  dir:-1},
 {k:'mult',    txt:e=>`规模每回合 ×${e.mult} — 加输出没用,得降阶`, hit:d=>cnt(d,'prune')-2,   dir:-1,
   lbl:n=>n<0?[`缺 ${-n} 张剪枝`,'red']:[`剪枝 ${n+2} 张 ✓`,'green']},
]
const cnt=(deck,...ids)=>deck.filter(c=>ids.includes(c)).length
function intelOf(deck,foeId,flawId,depth=0){
 const E=scaleFoe(FOE[foeId],depth),rows=[]
 for(const P of PROPS){ if(!E[P.k])continue
  const n=P.hit(deck)
  rows.push({txt:typeof P.txt==='function'?P.txt(E):P.txt,n,dir:P.dir,lbl:P.lbl}) }
 const SH=SHAPES[E.shape||'random']
 if(E.shape&&E.shape!=='random')rows.push({txt:'形状「'+SH.name+'」:'+SH.hint,n:0,dir:1,
   lbl:()=>[SH.name,'cyan']})
 if(E.noSplit)rows.push({txt:`不可分:段数上限 ${E.noSplit}、并行处理只剩四成`,n:cnt(deck,'divide','parallel'),dir:-1})
 if(flawId){const F=FLAW[flawId]
  rows.push({txt:`【失误】${F.name}:${F.note}`,n:flawId==='infinite'?(cnt(deck,'guard')?0:-1):1,dir:-1})}
 if(E.vmax&&E.vmax<T.VMAX)rows.push({txt:`值域窄(${T.VMIN}–${E.vmax}):平铺处理占便宜`,
   n:cnt(deck,'scan','lookup','dp','parallel'),dir:1})
 const bad=rows.filter(r=>r.dir<0).reduce((a,r)=>a+Math.abs(r.n),0)
 const good=rows.filter(r=>r.dir>0).reduce((a,r)=>a+r.n,0)
 const load=(E.n-38)/5+(E.inflow??0)-1.5              // 体量本身就是难度
 const pruneOK=E.mult&&cnt(deck,'prune')>=2?4:0       // Boss 带够剪枝就是顺手
 const score=good-bad-load+pruneOK
 return{E,flaw:flawId?FLAW[flawId]:null,rows,score,load,verdict:score>=1.5?['顺手','#8fd98f']:score<=-4?['不利','#ff7a6b']:score<=-1.5?['吃亏','#ffc46b']:['中性','#aebfd2']}
}

/* ═══ 6.6 B:失败诊断 ═══ */
function diagnose(S){
 const d=S.diag,out=[]
 if(d.lostKill>0)out.push({w:d.lostKill*11,t:`二分查找被打折:你出了 ${d.plays.bsearch||0} 张,少移除 ${Math.round(d.lostKill)} 个元素`})
 if(d.decked)out.push({w:900,t:'牌库、手牌、弃牌堆全空了 — 你没牌可出了'})
 if(d.evicted>0)out.push({w:d.evicted*9,t:`哈希碰撞:累计有 ${d.evicted} 张手牌被丢进消耗区,再也抽不到`})
 if(d.lostMemo>0)out.push({w:d.lostMemo*2,t:`预处理值撞上限:白投了 ${Math.round(d.lostMemo)} 点`})
 if(d.memoDecayed>0)out.push({w:d.memoDecayed*2,t:`数据在变:预处理值累计被侵蚀 ${d.memoDecayed} 点`})
 if(d.lostSort>0)out.push({w:d.lostSort*8,t:`最坏用例:快速排序累计少给 ${d.lostSort} 层有序`})
 if(d.extraDebt>0)out.push({w:d.extraDebt*3,t:`债务惩罚翻倍:额外烧掉 ${d.extraDebt} 点预算`})
 if(d.extraInflow>0)out.push({w:d.extraInflow*11,t:`稠密图惩罚切段:你切了 ${S.splits} 段,累计多涌入 ${d.extraInflow} 个元素`})

   这里逐条摆出来,并且带上「此刻造成了多少」。 */
function traits(){const E=S.E,o=[]
 const add=(t,v,c)=>o.push([t,v,c])
 const sh=SHAPES[E.shape||'random']
 add('数据形状 · '+sh.name,sh.hint,CO.cyan)
 if(E.shuffle)   add('自我打乱','每回合乱 '+(E.shuffle*3)+' 次 · 已累计 −'+S.diag.sortDecay+' 层',CO.amber)
 if(E.seqOnly)   add('顺序访问','二分查找 ×'+E.seqOnly+' · 已少移除 '+Math.round(S.diag.lostKill)+' 个',CO.amber)
 if(E.vmax&&E.vmax<T.VMAX) add('值域窄','柱高只到 '+E.vmax+'(常规 '+T.VMAX+')· 摊平型占便宜',CO.cyan)
 if(E.memoDecay) add('数据在变','预处理值每回合 −'+E.memoDecay+' · 已侵蚀 '+S.diag.memoDecayed,CO.amber)
 if(E.dense)     add('稠密','每多切 '+Math.round(1/E.dense)+' 段多涌入 1 · 已多来 '+S.diag.extraInflow+' 个',CO.amber)
 if(E.antiSort)  add('专克排序流','排序卡趟数 ×0.25 · 快排已少给 '+S.diag.lostSort+' 层',CO.red)
 if(E.antiGreedy)add('专克激进流','债务惩罚 ×2.2 · 已多烧 '+S.diag.extraDebt+' 预算',CO.red)
 if(E.memoCap)   add('专克复利流','预处理值上限 '+E.memoCap+' · 已白投 '+Math.round(S.diag.lostMemo),CO.red)
 if(E.noSplit)   add('专克拆解流','段数上限 '+E.noSplit+' · 并行处理只剩四成',CO.red)
 if(E.evict)     add('通用压制','每回合末随机丢 1 张手牌 · 已丢 '+(S.diag.evicted||0)+' 张',CO.red)
 if(E.mult>1)    add('指数增长','规模每回合 ×'+S.mult.toFixed(2)+' — 线性削减追不上',CO.red)
 if(S.FL)        add('【失误】'+S.FL.name,S.FL.note,CO.red)
 return o}

/* 十一个敌人本来共用同一套直方图 —— 名字讲了很多不一样,画面一个都没兑现。
   这一层只画「这堆数据长什么样」,不参与任何判定。
   back 画在柱子后面(压低透明度保证柱子可读),front 画在柱子上面。 */
const MOTIF={
 shuffled:{back(c){ // 乱序:顶端一条参差折线,直观「毫无秩序」
   const{ctx:X,a,x0,bw,base,hM,S}=c;X.strokeStyle='rgba(255,140,110,.35)';X.lineWidth=1.2;X.beginPath()
   a.forEach((b,i)=>{const x=x0+i*bw+bw/2,y=base-(b.v/S.vmax)*hM-7;i?X.lineTo(x,y):X.moveTo(x,y)});X.stroke()}},
 tape:{front(c){ // 磁带:底部走带 + 齿孔 + 只能从这头读
   const{ctx:X,x0,tw,base,A}=c,y=base+6
   X.strokeStyle='rgba(240,169,74,.5)';X.lineWidth=1;X.strokeRect(x0-6,y,tw+12,13)
   X.fillStyle='rgba(240,169,74,.45)'
   for(let x=x0;x<x0+tw;x+=13)X.fillRect(x,y+5,5,3)
   X.fillStyle=CO.amber;X.beginPath();X.moveTo(x0-14,y-4);X.lineTo(x0-3,y+6.5);X.lineTo(x0-14,y+17);X.closePath();X.fill()
   X.font='600 10px system-ui';X.textAlign='left';X.fillText('读头 · 只能从这头往后读',x0+6,y+30);X.textAlign='left'}},
 dupes:{back(c){ // 重复页:同值的柱子框成一组
   const{ctx:X,a,x0,bw,base,hM,S}=c;let i=0
   while(i<a.length){let j=i;while(j+1<a.length&&a[j+1].v===a[i].v)j++
    if(j>i){X.strokeStyle='rgba(95,208,232,.3)';X.setLineDash([3,3]);X.lineWidth=1
     X.strokeRect(x0+i*bw-2,base-(a[i].v/S.vmax)*hM-5,(j-i+1)*bw+1,(a[i].v/S.vmax)*hM+8);X.setLineDash([])}
    i=j+1}}},
 stream:{back(c){ // 价格流:一条流动的行情线
   const{ctx:X,a,x0,bw,base,hM,S,t}=c;X.strokeStyle='rgba(127,217,143,.4)';X.lineWidth=1.4;X.beginPath()
   a.forEach((b,i)=>{const x=x0+i*bw+bw/2
    const y=base-(b.v/S.vmax)*hM-10-Math.sin(i*.6+t*3)*5;i?X.lineTo(x,y):X.moveTo(x,y)});X.stroke()}},
 graph:{front(c){ // 稠密图:柱顶之间的连线网
   const{ctx:X,a,x0,bw,base,hM,S}=c;X.strokeStyle='rgba(179,157,219,.26)';X.lineWidth=.9;X.beginPath()
   for(let i=0;i<a.length;i++)for(const d of [3,7]){const j=i+d;if(j>=a.length)continue
    X.moveTo(x0+i*bw+bw/2,base-(a[i].v/S.vmax)*hM-3)
    X.lineTo(x0+j*bw+bw/2,base-(a[j].v/S.vmax)*hM-3)}X.stroke()}},
 worst:{back(c){ // 最坏用例:警戒斜纹
   const{ctx:X,A}=c;X.save();X.beginPath();X.rect(A.x,A.y,A.w,A.h);X.clip()
   X.strokeStyle='rgba(255,107,94,.09)';X.lineWidth=9
   for(let x=A.x-A.h;x<A.x+A.w;x+=34){X.beginPath();X.moveTo(x,A.y+A.h);X.lineTo(x+A.h,A.y);X.stroke()}X.restore()}},
 collide:{front(c){ // 哈希碰撞:底部的桶,有的桶挤了好几根
   const{ctx:X,x0,tw,base,a,bw}=c,B=8,w=tw/B
   for(let k=0;k<B;k++){const x=x0+k*w,hit=Math.min(4,Math.round(a.length/B))
    X.strokeStyle=hit>2?'rgba(255,107,94,.55)':'rgba(110,140,170,.3)';X.lineWidth=1
    X.strokeRect(x+3,base+7,w-6,12)
    X.fillStyle=hit>2?CO.red:CO.faint;X.font='600 9px system-ui';X.textAlign='center'
    X.fillText(hit>2?'撞 '+hit:''+hit,x+w/2,base+16);X.textAlign='left'}}},
 regret:{back(c){ // 反悔陷阱:一圈回退箭头
   const{ctx:X,A}=c,cx=A.x+A.w/2,cy=A.y+A.h*.42,r=Math.min(A.w,A.h)*.32
   X.strokeStyle='rgba(255,143,107,.16)';X.lineWidth=2.5
   X.beginPath();X.arc(cx,cy,r,.6,5.4);X.stroke()
   X.fillStyle='rgba(255,143,107,.22)';X.beginPath()
   X.moveTo(cx+r*Math.cos(5.4),cy+r*Math.sin(5.4));X.lineTo(cx+r*Math.cos(5.4)-11,cy+r*Math.sin(5.4)-4)
   X.lineTo(cx+r*Math.cos(5.4)-2,cy+r*Math.sin(5.4)+10);X.closePath();X.fill()}},
 explode2:{back(c){ // 状态爆炸:放射线
   const{ctx:X,A}=c,cx=A.x+A.w/2,cy=A.y+A.h
   X.strokeStyle='rgba(127,217,143,.12)';X.lineWidth=1.2
   for(let k=0;k<22;k++){const ang=-Math.PI*(k/21);X.beginPath();X.moveTo(cx,cy)
    X.lineTo(cx+Math.cos(ang)*A.w*.62,cy+Math.sin(ang)*A.h*1.1);X.stroke()}}},
 atomic:{front(c){ // 不可分:柱子底部焊成整块
   const{ctx:X,x0,tw,base}=c
   X.fillStyle='rgba(179,157,219,.3)';X.fillRect(x0-4,base+4,tw+8,7)
   X.strokeStyle='rgba(179,157,219,.6)';X.lineWidth=1.2;X.strokeRect(x0-4.5,base+3.5,tw+9,8)
   X.font='600 10px system-ui';X.fillStyle='rgba(179,157,219,.8)';X.textAlign='center'
   X.fillText('焊死的一整块 · 切不开',x0+tw/2,base+26);X.textAlign='left'}},
 expo:{back(c){ // Boss:指数曲线在背后长
   const{ctx:X,A,t}=c;X.strokeStyle='rgba(255,107,94,.22)';X.lineWidth=2;X.beginPath()
   for(let k=0;k<=60;k++){const u=k/60,x=A.x+u*A.w,y=A.y+A.h-Math.pow(u,2.6)*A.h*.95
    k?X.lineTo(x,y):X.moveTo(x,y)}X.stroke()
   X.fillStyle='rgba(255,107,94,'+(.10+.05*Math.sin(t*2))+')';X.fillRect(A.x,A.y,A.w,A.h)}},
}
function arena(A){
 const a=alive(S); if(!a.length)return
 const t=anim?Math.min(1,(performance.now()-anim.t0)/anim.dur):1
 if(anim&&t>=1)anim=null
 const bw=Math.min(24,A.w/Math.max(a.length,1)),seg=Math.ceil(a.length/S.splits)
 const tw=a.length*bw+(S.splits-1)*18,x0=A.x+(A.w-tw)/2,base=A.y+A.h-30,hM=A.h-46
 const mc={ctx,A,a,x0,tw,base,hM,bw,S,t:performance.now()/1000}
 const M=MOTIF[S.foeId]; if(M&&M.back)M.back(mc)
 // 段分隔
 if(S.splits>1)for(let s2=1;s2<S.splits;s2++){const sx=x0+s2*seg*bw+(s2-1)*18+9
  ctx.strokeStyle='rgba(179,157,219,.35)';ctx.setLineDash([4,4]);ctx.lineWidth=1
  ctx.beginPath();ctx.moveTo(sx,A.y);ctx.lineTo(sx,base);ctx.stroke();ctx.setLineDash([])}
 a.forEach((b,i)=>{const sg=Math.floor(i/seg),x=x0+i*bw+sg*18
  let v=b.v
  if(anim){const before=anim.before.find(o=>o.id===b.id)
   if(before)v=before.v+(b.v-before.v)*ease(t)}
  const h=Math.max(2,(v/S.vmax)*hM)
  let dim=1
  if(anim&&anim.kind==='sweep'&&i>t*a.length)dim=.42
  if(anim&&anim.kind==='split'){const half=a.length*.5
   if(t<.7&&(i<half*(1-t)||i>a.length-half*(1-t)*.6))dim=.2}
  bar(x,base-h,bw-3,h,v,S.vmax,dim)})
 if(M&&M.front)M.front(mc)
 // 死掉的柱子:碎裂
 if(anim){anim.before.forEach((o,i)=>{ if(anim.after.get(o.id)!==null)return
   const idx=anim.before.indexOf(o),x=x0+idx*bw
   const h=(o.v/S.vmax)*hM*(1-ease(t))
   ctx.globalAlpha=1-t;bar(x,base-h,bw-3,Math.max(1,h),o.v,S.vmax);ctx.globalAlpha=1
   if(t<.35&&Math.random()<.3)parts.push({x:x+bw/2,y:base-h,vx:(Math.random()-.5)*3,vy:-Math.random()*3-.5,life:1,c:'#f0a94a'})})}
 // 扫描线
 if(anim&&anim.kind==='sweep'){const sx=x0+tw*t
  const lg=ctx.createLinearGradient(sx-44,0,sx+44,0)
  lg.addColorStop(0,'rgba(95,208,232,0)');lg.addColorStop(.5,'rgba(191,242,255,.95)');lg.addColorStop(1,'rgba(95,208,232,0)')
  ctx.fillStyle=lg;ctx.fillRect(sx-44,A.y,88,A.h)}
 // 移除类:被打掉的位置炸一下白光
 if(anim&&anim.kind==='burst'){const k=1-ease(t)
  anim.before.forEach(o=>{ if(anim.after.get(o.id)!==null)return
   const idx=anim.before.indexOf(o),x=x0+idx*bw+bw/2
   ctx.fillStyle='rgba(255,236,190,'+(k*.85)+')'
   ctx.fillRect(x-bw*.9,base-(o.v/S.vmax)*hM-6,bw*1.8,(o.v/S.vmax)*hM+12)
   ctx.strokeStyle='rgba(255,180,120,'+(k*.7)+')';ctx.lineWidth=2
   ctx.beginPath();ctx.arc(x,base-8,(1-k)*38,0,7);ctx.stroke()
   if(t<.3&&Math.random()<.55)parts.push({x,y:base-(o.v/S.vmax)*hM,
     vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,life:1,c:'#ffd08a'})})}
 // 排序:把「正在变有序」这件事显出来 —— 相邻逆序对高亮
 if(anim&&anim.kind==='sort'){const k=Math.sin(t*Math.PI)
  for(let i=0;i<a.length-1;i++) if(a[i].v>a[i+1].v){
   const sg=Math.floor(i/seg),x=x0+i*bw+sg*18
   ctx.fillStyle='rgba(255,140,110,'+(k*.4)+')';ctx.fillRect(x,base-6,bw*2-3,5)}
  }
 // 二分刀口
 if(anim&&anim.kind==='split'){const sx=x0+tw*.5
  ctx.strokeStyle='rgba(255,216,138,'+(1-t*.5)+')';ctx.lineWidth=2;ctx.setLineDash([7,6])
  ctx.beginPath();ctx.moveTo(sx,A.y-6);ctx.lineTo(sx,base+8);ctx.stroke();ctx.setLineDash([])}
 parts=parts.filter(p=>p.life>0)
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=.02
  ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,2.6,2.6);ctx.globalAlpha=1})
 floatRead(A)}
/* 飘字读数:每出一张牌都说清「这一下到底改了什么」,
   不碰柱子的那 7 张(批处理/观察/预处理/建表/剪枝/回溯/边界条件)全靠它 */
function floatRead(A){ if(!flo)return
 const ft=(performance.now()-flo.t0)/flo.dur
 if(ft>=1){flo=null;return}
 const al=ft<.12?ft/.12:ft>.72?(1-ft)/.28:1
 // 起点要避开敌人说明和失误横幅(它们在 A.y 上方到 A.y+45)
 const cx=A.x+A.w/2, y0=A.y+96-ft*30
 ctx.textAlign='center';ctx.globalAlpha=Math.max(0,al)
 ctx.font='600 11px system-ui';ctx.fillStyle=CO.faint;ctx.fillText(flo.name,cx,y0-16)
 flo.lines.forEach((l,i)=>{const y=y0+i*23
  ctx.font='700 17px system-ui';const w=ctx.measureText(l[0]).width
  ctx.fillStyle='rgba(5,10,17,.9)';ctx.fillRect(cx-w/2-15,y-18,w+30,26)
  ctx.strokeStyle=l[1];ctx.globalAlpha=Math.max(0,al)*.45;ctx.lineWidth=1
  ctx.strokeRect(cx-w/2-14.5,y-17.5,w+29,25);ctx.globalAlpha=Math.max(0,al)
  ctx.fillStyle=l[1];ctx.fillText(l[0],cx,y)})
 ctx.globalAlpha=1;ctx.textAlign='left'}
const ease=t=>1-Math.pow(1-t,3)

/* 卡面第二行:把「1+有序层数×2」这种公式换算成此刻的真实数字。
   R2「卡面可推,不许查表」的补完 —— 光有规则不够,得让人看见规则算出来是多少。 */
/* 摊平型的卡(遍历/并行处理/查表/DP)把总处理量平分给每个元素。
   规模越大每根分到越少 —— 这是「平铺处理不随规模缩放」的手感来源,
   但只写「总处理量 16」玩家看不出后果,得把除法和打掉几个都算出来。 */
function wprev(tot){const a=alive(S); if(!a.length)return null
 let t=tot; if(S.halfNext)t*=.7
 if(S.flawId==='offByOne'&&!S.guarded)t*=.9
 const per=t/a.length
 const hp=Math.min(100,Math.round(t/Math.max(S.totalWork,1)*1000)/10)
 // 「打掉 0 个」会冤枉它 —— 摊平型的贡献在血条上,不在个数上
 return{per:per<1?per.toFixed(2):per.toFixed(1),k:a.filter(b=>b.v<=per).length,n:a.length,
        hp,tail:(a.filter(b=>b.v<=per).length?' · 打掉 '+a.filter(b=>b.v<=per).length+' 个':'')+' · 血条 −'+hp+'%'}}
function live(id){ if(!S)return null
 if(!alive(S).length)return null   // 元素清零(赢了)时 wprev 返回 null,别再往下算
 const n=N(S),t=tier(S),sp=S.splits,m=S.memo,d=S.debt,seq=S.E.seqOnly,half=S.E.noSplit?.4:1
 const G=CO.green,A=CO.amber,Cy=CO.cyan,R=CO.red,P='#b39ddb'
 switch(id){
  case 'scan':{const w=wprev(16)
    return ['16 ÷ '+w.n+' 个 = 每根矮 '+w.per+w.tail,w.k>0?G:Cy]}
  case 'batch':    return ['预算 '+S.budget+' → '+(S.budget+5),G]
  case 'watch':    return ['抽 2 · 牌库还剩 '+S.draw.length+' 张',Cy]
  case 'bubble': case 'merge': case 'quick':
    return ['有序层数 '+t+'/4'+(S.E.antiSort?' · 最坏用例下趟数只剩两五折':''),A]
  case 'bsearch':{const f=1+t*2,act=seq?Math.max(1,Math.round(f*seq)):f
    return ['现在移除 '+act+' 个 ← 有序层数 '+t+'/4'+(seq?' 且顺序访问打七折':''),act>=5?G:act>1?A:R]}
  case 'median':   return t>=3?['现在移除 '+Math.ceil(n/3)+' 个 ← 规模 '+n+' 的 1/3',G]
                              :['有序层数 '+t+',不到 3 —— 现在出会落空',R]
  case 'divide':   return sp<(S.E.noSplit??4)?['段数 '+sp+' → '+(sp+1),G]
                              :['段数已到上限 '+sp+' —— 现在出会落空',R]
  case 'mergeup':  return ['现在移除 '+(2*sp)+' 个 ← 段数 '+sp+' × 每段 2',sp>=3?G:A]
  case 'parallel':{const tot=sp*14*half,w=wprev(tot)
    return ['段数 '+sp+'×14'+(half<1?'×四折':'')+'='+Math.round(tot)+' ÷ '+w.n+' 个 = 每根矮 '+w.per+w.tail,w.k>0?G:sp>=3?G:A]}
  case 'recur':    return sp>=3?['现在移除 '+Math.ceil(n/3)+' 个 ← 规模 '+n+' 的 1/3',G]
                              :['段数 '+sp+',不到 3 —— 现在出会落空',R]
  case 'pre':      return ['预处理值 '+m+' → '+Math.min(S.E.memoCap??999,m+8),G]
  case 'table':{const g=10+Math.ceil(n/4)
    return ['预处理值 '+m+' → '+Math.min(S.E.memoCap??999,m+g)+'(按规模 '+n+' 算)',G]}
  case 'lookup':{ if(!m)return['预处理值还是 0 —— 现在出会落空',R]
    const w=wprev(m);return['预处理值 '+m+' ÷ '+w.n+' 个 = 每根矮 '+w.per+w.tail+'(不消耗)',w.k>0?G:A]}
  case 'dp':{ if(!m)return['预处理值还是 0 —— 现在出会落空',R]
    const w=wprev(m*2);return['预处理值 '+m+'×2='+(m*2)+' ÷ '+w.n+' 个 = 每根矮 '+w.per+w.tail,w.k>0?G:A]}
  case 'greedy':   return ['移除 2 个 · 债务 '+d+' → '+(d+1),A]
  case 'local':    return ['移除 5 个 · 债务 '+d+' → '+(d+2),A]
  case 'heur':     return ['现在移除 '+(2+Math.min(d,6))+' 个 ← 债务 '+d+'(按 6 封顶)',d>=3?G:A]
  case 'anneal':   return d>0?['现在移除 '+(d*2)+' 个,债务清零',G]:['债务是 0 —— 现在出会落空',R]
  case 'approx':   return ['现在移除 '+Math.ceil(n/4)+' 个 ← 规模 '+n+' 的 1/4 · 债务 +3',G]
  case 'prune':    return (S.mult>1||S.inflow>0)
    ?['倍率 '+S.mult.toFixed(2)+' → '+Math.max(1,S.mult-.25).toFixed(2)+' · 涌入 '+S.inflow+' → '+Math.max(0,S.inflow-1),G]
    :['倍率和涌入都到底了 —— 现在出会落空',R]
  case 'backtrack':return ['预算 '+S.budget+' → '+(S.budget+12),G]
  case 'guard':    return S.FL?['本回合免疫「'+S.FL.name+'」',G]:['这一关没挂失误 —— 现在出会落空',R]
  case 'hash':     return ['抽 1 · 移除 2 个',Cy]
  case 'buildheap':return S.heapLv?['堆已经建好了('+S.heapLv+'/回合)—— 现在出会落空',R]
                                  :['建成后每回合末自动弹出 1 个【高度 ≤6】的,不占步数',G]
  case 'heapify':  return S.heapLv?['堆 '+S.heapLv+' → '+(S.heapLv+1)+' 个/回合',G]
                                  :['还没建堆 —— 现在出会落空',R]
  case 'poptop':{const a=alive(S).slice().sort((x,y)=>x.v-y.v).slice(0,2)
    return['砍掉最矮的两根:'+a.map(b=>b.v).join('/'),a.length?G:R]}
  case 'heapsort': return['有序 +2 · 再砍掉最矮的两根',A]
  case 'medstream':{const a=alive(S);if(!a.length)return null
    const vs=a.map(b=>b.v).sort((x,y)=>x-y),med=vs[vs.length>>1]
    return['中位数是 '+med+' · 一次清掉 '+a.filter(b=>b.v<med).length+' 个(严格低于)',G]}
  case 'twoptr':   return['两头各切 2 根 · 现在剩 '+n+' 根',n>=4?G:A]
  case 'window':   return['从最左切走连续 3 根 · 现在剩 '+n+' 根',n>=3?G:A]
  case 'prefix':   return S.prefix?['前缀和已经建好了 —— 现在出会落空',R]
                                  :['此后摊平类处理量 ×1.15(遍历 16 → 18)',G]
  case 'diff':{const a=alive(S).slice(0,6),k=a.filter(b=>b.v<=4).length
    return['连续 6 根各降 4 点 · 其中 '+k+' 根会直接清零',k>=3?G:A]}
  case 'merge2':{const a=alive(S);let c=0
    for(let i=1;i<a.length;i++)if(a[i].v===a[i-1].v)c++
    return['现在有 '+c+' 对相邻等高 —— 能合并掉 '+c+' 根',c>=5?G:c?A:R]}
  case 'monoq':    return S.monoq?['已经生效了 —— 现在出会落空',R]
                                 :['此后每回合末保留最贵的一张手牌',G]
  case 'insertion':{const sd=Math.round(sortedness(S)*100)
    return sd>=50?['有序度 '+sd+'% ≥50% —— 这一张直接把它排完',G]
                 :['有序度 '+sd+'%,不到 50% —— 只 +1 层(逆序对太多)',R]}
  case 'counting':{const a=alive(S);if(!a.length)return null
    const mn=Math.min(...a.map(b=>b.v)),k=a.filter(b=>b.v<=mn+2).length
    return['最矮的是 '+mn+' · 现在能一次清掉 '+k+' 个(值 ≤ '+(mn+2)+')',k>=6?G:k>=3?A:R]}
  case 'topk':{const a=alive(S);if(!a.length)return null
    const t=a.slice().sort((x,y)=>y.v-x.v).slice(0,3)
    return['砍掉最高的三根:'+t.map(b=>b.v).join('/')+' —— 共 '+t.reduce((x,b)=>x+b.v,0)+' 点处理量',G]}
  case 'sortdeck':{const d=S.draw;if(!d.length)return['牌库空了 —— 现在出会落空',R]
    const cheap=d.filter(x=>C[x].cost<=1).length
    return['牌库 '+d.length+' 张,其中 '+cheap+' 张是 1 费以下 —— 排完先抽它们',cheap>=3?G:A]}
  case 'fetch':{if(!S.draw.length)return['牌库空了 —— 现在出会落空',R]
    let bi=0;for(let i=1;i<S.draw.length;i++)if(C[S.draw[i]].cost>C[S.draw[bi]].cost)bi=i
    return['翻出「'+C[S.draw[bi]].name+'」('+C[S.draw[bi]].cost+' 费)',G]}
  case 'prefetch':{const t=S.draw.slice(-3);if(!t.length)return['牌库空了 —— 现在出会落空',R]
    let bi=0;for(let i=1;i<t.length;i++)if(C[t[i]].cost>C[t[bi]].cost)bi=i
    return['牌库顶是 '+t.map(x=>C[x].name).reverse().join('/')+' → 拿「'+C[t[bi]].name+'」',G]}
  case 'memoize':{if(!S.lastPlayed)return['这回合还没出过牌 —— 现在出会落空',R]
    return['重放「'+C[S.lastPlayed].name+'」',G]}
  case 'compress':return S.discard.length
    ?['弃牌堆 '+S.discard.length+' 张立刻洗回牌库 · 再抽 1',G]
    :['弃牌堆是空的,只会抽 1 张',A]
 }
 return null}

function wrap(t,x,y,w,lh){let l='',yy=y
 for(const ch of t){if(ctx.measureText(l+ch).width>w){ctx.fillText(l,x,yy);l=ch;yy+=lh}else l+=ch}
 ctx.fillText(l,x,yy)}
/* 渲染里抛一次异常就掐断 rAF 链、画面永久冻结 —— 一个卡面小 bug 直接变成「游戏卡死」。
   兜住它:循环必须继续,并且把错误摆到屏幕上,而不是只躺在控制台里。 */
let drawErr=null
const req=()=>requestAnimationFrame(()=>{
 try{ draw() }
 catch(err){
  if(!drawErr){drawErr=err;console.error('渲染异常:',err)}
  try{
   ctx.fillStyle='rgba(120,20,16,.92)';ctx.fillRect(0,H-46,W,46)
   ctx.fillStyle='#ffd9d4';ctx.font='600 13px system-ui';ctx.textAlign='left'
   ctx.fillText('渲染出错(游戏还在跑,按 1–7 可重开):'+err.message,20,H-18)
  }catch(_){}
  requestAnimationFrame(()=>{try{draw()}catch(_){requestAnimationFrame(()=>{try{draw()}catch(_){}})}})
 }})
const inBox=(mx,my,b)=>b&&mx>b[0]&&mx<b[0]+b[2]&&my>b[1]&&my<b[1]+b[3]
cv.addEventListener('click',e=>{const mx=e.clientX,my=e.clientY
 if(RUN.over){startRun(KIT);return}
 if(intel){for(let k=0;k<NODEBOX.length;k++)if(inBox(mx,my,NODEBOX[k])){pickNode(k);return}
  return}
 if(inBox(mx,my,btn.last)){offer?takeCard(null):window.__end();return}
 const ids=offer||S.hand
 for(let i=0;i<ids.length;i++) if(inBox(mx,my,HITBOX[i])){offer?takeCard(ids[i]):uiPlay(i);return}})
addEventListener('keydown',e=>{
 if(intel){const k={ArrowLeft:0,ArrowRight:1,Enter:0,' ':0}[e.key]
  if(k!==undefined&&NODEBOX[k]){e.preventDefault();pickNode(k);return}}
 const k=['base','sort','dc','memo','greedy','heap','twop'][+e.key-1]; if(k){startRun(k);return}
 if(e.key==='a'||e.key==='A'){ if(autoTimer){clearInterval(autoTimer);autoTimer=null}
  else autoTimer=setInterval(()=>{ if(RUN.over){clearInterval(autoTimer);autoTimer=null;return}
   if(intel){pickNode(intel.length>1&&intel[1].score>intel[0].score?1:0);return}
   if(offer){takeCard(offer.find(c=>KITS[KIT].includes(c))??offer[0]);return}
   autoTurn()},420)}})
startRun('sort');draw()
</script></body></html>
