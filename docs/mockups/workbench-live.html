  <!--
    外观：随系统 / 白天 / 黑夜。真源是平台的 localStorage["xm-theme"]
    （主站 lib/theme.ts），主站、虾米看股、虾米看AI 都照它走。

    **必须内联、必须在 <head> 里、必须同步执行。** React 挂载时浏览器已经画过
    一帧了 —— 那一帧用的是默认的浅色，于是选了黑夜的人每翻一页都要先被闪一下白，
    而闪白正是这个功能要消灭的东西。

    **只读手动选的那一档。** 「随系统」= 把标记删掉，不是在这里算出一个 light/dark
    写进去 —— 算出来的是一张拍下来那一刻的快照，系统入夜自动转深色时页面反而不跟了。
    跟随系统由 CSS 的 prefers-color-scheme 直接管住，不需要 JS。

    这段与主站 lib/theme.ts 的 THEME_BOOT_SCRIPT 是同一段；子应用各自内联一份拷贝，
    因为它们构建时拿不到主站的模块。改那边要改这边。
  -->

:`阶码`,gloss:`IEEE 754 里表示"小数点挪了几位"的那一段。存的是加过偏置的移码，不是原码。`},{id:`mant`,term:`尾数`,gloss:`有效数字那一段。规格化之后整数位恒为 1，所以那个 1 不存，叫隐含位。`},{id:`bias`,term:`移码 / 偏置`,gloss:`阶码存的是「真值 + 127」（单精度）。这样全 0 最小、全 1 最大，比大小可以直接按无符号比。`},{id:`normal`,term:`规格化`,gloss:`把尾数挪成 1.xxx 的形式，阶码相应加减。加减法对阶之后也要重新规格化。`},{id:`booth`,term:`Booth 算法`,gloss:`看相邻两位的组合决定加、减还是只移位，一次处理一位但能直接算带符号数，不用先取绝对值。`},{id:`restore`,term:`加减交替法`,gloss:`也叫不恢复余数法。余数为负时不退回去，下一步改成加法补偿 —— 省掉一次恢复操作。`},{id:`pipeline`,term:`流水线 / 段`,gloss:`一条指令拆成取指、译码、执行、访存、写回五段，不同指令的不同段同时进行。理想情况下每周期出一条。`},{id:`hazard`,term:`数据冒险`,gloss:`后一条指令要用的值，前一条还没写回去。只能等，或者用前递把值直接送过去。`},{id:`forward`,term:`前递（旁路）`,gloss:`不等写回，把运算结果直接从上一段送到下一段的输入。能消掉大部分停顿。`},{id:`page`,term:`页 / 页框`,gloss:`虚存把地址空间切成等大的「页」，物理内存切成同样大的「页框」。页表记的就是哪一页放在哪一框。`},{id:`tlb`,term:`TLB`,gloss:`页表项的小缓存。命中就省掉一次访存；不命中才去查页表，查完把结果塞回 TLB。`},{id:`vaddr`,term:`虚地址拆分`,gloss:`低位是页内偏移（页多大就占几位），高位是页号。偏移原样搬到物理地址上，只有页号要查表翻译。`},{id:`pagefault`,term:`缺页`,gloss:`要访问的页不在内存里，得从磁盘调进来。物理块满了就要按置换算法挤走一页。`},{id:`belady`,term:`Belady 异常`,gloss:`物理块给多了，缺页反而更多。FIFO 会出现，LRU 和 OPT 不会 —— 这是它们的分水岭。`},{id:`opt`,term:`OPT / CLOCK`,gloss:`OPT 挤"以后最久不用的"，需要预知未来，只能当理论上界。CLOCK 是 LRU 的近似：给每页一个使用位，转着圈找位是 0 的。`},{id:`turnaround`,term:`周转时间 / 带权`,gloss:`周转 = 完成时刻 − 到达时刻。带权周转 = 周转 ÷ 服务时间，衡量"等得值不值"。`},{id:`preempt`,term:`抢占 / 时间片`,gloss:`抢占是可以打断正在跑的进程。RR 按固定时间片轮着来，SRTF 一有更短的来了就抢。`},{id:`seek`,term:`寻道`,gloss:`磁头从当前磁道移到目标磁道。寻道时间是磁盘访问的大头，所以调度算法就是在省磁头的路程。`},{id:`scan`,term:`SCAN / LOOK / C-SCAN`,gloss:`SCAN 走到磁盘边界才掉头，LOOK 走到最远的请求就掉头，C-SCAN 到头之后直接回到另一端单向再来一遍。`},{id:`safeseq`,term:`安全序列`,gloss:`存在一个进程排列，按这个顺序每个进程都能拿到它还差的资源、跑完、把资源还回来。找得到就是安全状态。`},{id:`needmax`,term:`Max / Allocation / Need`,gloss:`Max 是进程声明的最大需求，Allocation 是已经给它的，Need = Max − Allocation 是它还差的。`},{id:`deadlock`,term:`死锁`,gloss:`一组进程各自拿着一部分资源、又都在等别人手里的，谁也走不了。银行家算法是在事前避免进入这种状态。`},{id:`fragment`,term:`外碎片 / 内碎片`,gloss:`外碎片是分区之间零散的小空闲，加起来够用但连不成一块。内碎片是分给你却用不上的那部分。`},{id:`fitpolicy`,term:`首次 / 最佳 / 最坏 / 邻近适应`,gloss:`从头找第一个够大的 / 找最小的够大的 / 找最大的那块 / 从上次停的地方接着找。四种在同一串请求下会分到完全不同的地址。`},{id:`inode`,term:`混合索引`,gloss:`inode 里前几个指针直接指数据块，再往后是一级、二级、三级间址。小文件一次访问就到，大文件多绕几层。`},{id:`semaphore`,term:`信号量 / PV`,gloss:`P 是申请（减一，不够就阻塞），V 是释放（加一）。生产者消费者里 empty/full 数格子、mutex 保互斥。`},{id:`pvorder`,term:`P 操作的顺序`,gloss:`必须先 P 资源信号量（empty/full）再 P 互斥（mutex）。反过来会抱着锁去睡觉，直接死锁 —— 这个实验能让它真的死给你看。`},{id:`bitmap`,term:`位示图`,gloss:`一位对应一个盘块，0 空闲 1 已用。分配就是找 0，回收就是置 0，关键是位号跟盘块号怎么换算。`},{id:`stable`,term:`稳定性`,gloss:`相等的元素排完之后相对次序有没有变。冒泡、插入、归并稳定；快排、堆、选择、希尔不稳定。`},{id:`pass`,term:`趟`,gloss:`一轮完整的处理。冒泡每趟确定一个最大值，插入每趟把一个元素插进前面的有序段。`},{id:`settled`,term:`已定位 / 局部有序`,gloss:`两回事：冒泡、选择、快排、堆每趟能**确定**某些元素的最终位置；插入、希尔、归并只是让一段**暂时有序**，后面还会动。`},{id:`relax`,term:`松弛`,gloss:`Dijkstra 的核心动作：如果"经过刚确定的点再到 v"比现在记的距离短，就更新它。`},{id:`sptree`,term:`最短路径树`,gloss:`每个点记住"我是从谁那儿被松弛到最短的"，这些边连起来就是一棵树。`},{id:`bf`,term:`平衡因子`,gloss:`左子树高 − 右子树高。AVL 要求每个结点的绝对值不超过 1，超了就旋转。`},{id:`rotate`,term:`LL / RR / LR / RL`,gloss:`按"失衡结点往下两步的方向"命名。同向（LL/RR）转一次，异向（LR/RL）要先把下面掰同向再转，一共两次。`},{id:`border`,term:`B+ 树的阶`,gloss:`m 阶最多 m−1 个键，满了就分裂、把中间的键提到父结点。所有真数据都在叶子层，叶子还串成链表。`},{id:`asl`,term:`ASL`,gloss:`平均查找长度：把每个关键字查到它所需要比较的次数平均一下。散列表比的就是这个。`},{id:`collide`,term:`拉链 / 开放定址`,gloss:`冲突了挂成链表，还是在表里另找一个空槽。后者又分线性探测、平方探测、再散列。`},{id:`clustering`,term:`堆积（聚集）`,gloss:`线性探测的老毛病：冲突的元素挤成一片连续的占用，后来的一撞就要探很多次。平方探测就是为了打散它。`},{id:`wpl`,term:`WPL`,gloss:`带权路径长度 = Σ(权值 × 到根的层数)。哈夫曼树让它最小，而且它恰好等于所有内部结点权值之和。`},{id:`prefix`,term:`前缀码`,gloss:`任何一个编码都不是另一个的前缀，所以码流不用分隔符也能唯一解码。哈夫曼编码天然是前缀码。`},{id:`next`,term:`next 数组`,gloss:`模式串每个位置上"最长的相等前后缀"有多长。失配时靠它决定模式串往右滑多远。`},{id:`noback`,term:`主串不回退`,gloss:`KMP 相对暴力法的全部好处：主串的指针只往前走，失配时只挪模式串。`},{id:`mst`,term:`最小生成树`,gloss:`连通所有点、总权值最小的那棵树。Prim 从一个点长出去，Kruskal 从最小的边挑起，两者总权值必然相同。`},{id:`cycle`,term:`环 / 连通`,gloss:`Kruskal 每挑一条边都要问"加了会不会成环"；Prim 每次只从"已经连上的那堆"往外挑。`},{id:`topo`,term:`拓扑序`,gloss:`把有向无环图排成一列，使每条边都从前指向后。做法是反复取出入度为 0 的点。`},{id:`aoe`,term:`AOE 网 / ve / vl`,gloss:`边表示活动、点表示事件。ve 是事件最早能发生的时刻（正推取最大），vl 是最迟不影响工期的时刻（逆推取最小）。`},{id:`critical`,term:`关键路径`,gloss:`余量为 0 的活动串起来的那条路。它决定整个工程的最短工期，拖它一天整体就晚一天。`},{id:`dfsbfs`,term:`DFS / BFS`,gloss:`深度优先一条路走到黑，用栈；广度优先一圈一圈铺开，用队列。图不连通时都要从新的起点重来。`},{id:`cwnd`,term:`拥塞窗口 cwnd`,gloss:`发送方自己估出来的"网络能吃下多少"。真正能发多少是它和接收窗口里的较小者。`},{id:`ssthresh`,term:`慢启动阈值 ssthresh`,gloss:`慢启动和拥塞避免的分界线。cwnd 小于它就翻倍涨，达到之后改成每轮 +1。丢包时它被砍成一半。`},{id:`phases`,term:`慢启动 / 拥塞避免 / 快恢复`,gloss:`指数涨 / 线性涨 / 三次重复 ACK 后不回到慢启动而是减半接着线性涨（Reno）。超时才回慢启动。`},{id:`gbnsr`,term:`GBN / SR`,gloss:`回退 N：一个丢了后面全部重传，接收方只按序收。选择重传：只重传丢的那个，接收方能缓存乱序到达的。`},{id:`cumack`,term:`累积确认`,gloss:`ACK n 表示"n 之前的我全收到了"。GBN 用它；SR 是逐帧确认，不累积。`},{id:`crc`,term:`CRC / 生成多项式`,gloss:`把数据当成多项式除以约定的生成多项式，余数当校验位附在后面。收端整除得 0 就认为没错。`},{id:`hamming`,term:`海明码 / 校验子`,gloss:`在 2 的幂次位上插校验位，每位负责一组数据位。收端算出的校验子恰好等于出错位的位号 —— 所以能纠一位。`},{id:`mask`,term:`子网掩码 / CIDR`,gloss:`掩码里连续的 1 划出网络号、0 是主机号。/26 就是前 26 位是网络号，剩 6 位给主机（去掉全 0 全 1 两个）。`},{id:`longest`,term:`最长前缀匹配`,gloss:`路由表里可能有多条都匹配，选掩码最长（最具体）的那条。`},{id:`handshake`,term:`三次握手 / 四次挥手`,gloss:`建连要三步是因为得双向确认初始序号；断连要四步是因为两个方向各自关，中间可以只关一边。`},{id:`timewait`,term:`TIME_WAIT`,gloss:`主动关闭方最后要等 2MSL：一是保证最后那个 ACK 送到，二是让旧连接的迷路报文自然消亡。`},{id:`csma`,term:`CSMA/CD`,gloss:`先听后发、边发边听、冲突就停、随机等一会儿再来。只用于共享介质的以太网。`},{id:`backoff`,term:`二进制指数退避`,gloss:`第 k 次冲突就从 0 到 2^k−1 里随机挑一个数，等这么多个争用期。冲突越多等得越久，16 次后放弃。`}],mo={cache:{question:`同一串内存地址，Cache 怎么摆能少跑几趟内存？`,read:[{at:`上面那条彩色的位串`,is:`当前访问的地址被切成三段：标记 / 组号 / 块内偏移。`},{at:`中间的格子矩阵`,is:`Cache 本身。竖着是组，横着是组内的路。虚线箭头指向这次落到哪一组。`},{at:`轴上的柱子`,is:`到这一步为止的滚动命中率 —— 绿格命中、红格缺失。`}],try:[{act:`把相联度从 2 调到 1`,watch:`地址拆分里组号变长、标记变短；同组冲突的那几个地址开始互相挤，命中率掉下来。`,param:`相联度`},{act:`换成「同组冲突」预置序列`,watch:`这串地址全落在同一组 —— 相联度 1 时几乎全红，调到 4 就几乎全绿。`,preset:`同组冲突`},{act:`把块大小从 16 调到 64`,watch:`块内偏移占的位变多、组号变少；顺序访问会因为"搬一块就带进来好几个"而变好。`,param:`块大小`}],terms:[`hit`,`setassoc`,`direct`,`fullassoc`,`tagidx`,`lru`,`locality`]},scheduler:{question:`同一批进程，换个调度算法，谁先跑完、平均等多久？`,read:[{at:`甘特图每一行`,is:`一个进程。深色格是它在 CPU 上跑，浅色是就绪等待。`},{at:`进程表`,is:`题面数据：到达时刻和服务时间。可以直接改，也可以加一行。`},{at:`右边读数`,is:`当前时刻在跑谁、就绪队列里排着谁、还剩多少。`}],try:[{act:`装上「护航效应」预置，在 FCFS 和 SJF 之间切`,watch:`长作业排在前面时 FCFS 的平均周转明显吃亏 —— 后面一串短作业全被它堵着。`,param:`调度算法`,preset:`护航效应`},{act:`选 RR，再把时间片从 2 调到 1`,watch:`切换次数翻倍，甘特图变碎；时间片越小越"公平"，但切换开销也越大。`,param:`时间片`},{act:`选 SRTF`,watch:`每来一个更短的作业就抢占，甘特图上会看到正在跑的被打断。`,param:`调度算法`}],terms:[`turnaround`,`preempt`]},tcp:{question:`一条 TCP 连接遇到丢包，发送窗口是怎么涨、怎么砍的？`,read:[{at:`锯齿曲线`,is:`实线是 cwnd，虚线是 ssthresh。竖的红虚线是丢包事件。`},{at:`状态机页签`,is:`当前处在慢启动、拥塞避免还是快恢复，以及这一档的涨法。`}],try:[{act:`把丢包事件表里的类型改成 timeout`,watch:`cwnd 直接掉回 1、回到慢启动 —— 比三次重复 ACK 惨得多。`},{act:`把丢包时刻往后挪`,watch:`ssthresh 被砍成"当时 cwnd 的一半"，所以砍在越高处，之后线性段的起点越高。`}],terms:[`cwnd`,`ssthresh`,`phases`]},page:{question:`同一串页面引用，哪种置换算法缺页少？多给物理块一定更好吗？`,read:[{at:`置换表`,is:`每一列是一次引用，格子里是当时各物理块装着谁，红色表示这次缺页。`},{at:`引用串输入框`,is:`题面数据，可以直接改。`}],try:[{act:`选 FIFO，把物理块数从 3 调到 4，用「Belady 经典串」那条预置`,watch:`缺页次数不降反升 —— 这就是 Belady 异常，LRU 和 OPT 换过去就不会。`,param:`物理块数`,preset:`Belady 经典串`},{act:`同一串分别跑 OPT 和 LRU`,watch:`OPT 是理论下界，LRU 通常最接近它；差多少就是"预知未来"值多少。`,param:`置换算法`}],terms:[`pagefault`,`belady`,`opt`,`lru`]},disk:{question:`一队磁道请求，磁头按什么顺序走最省？`,read:[{at:`轨迹图`,is:`横轴是磁道号，折线是磁头走过的路。空心虚线圈是"只是路过或掉头"的折返点。`},{at:`右边读数`,is:`这一步移动了多少磁道、累计多少。`}],try:[{act:`在 SCAN 和 LOOK 之间切`,watch:`差别只在最后：SCAN 会一直走到磁盘边界才掉头，LOOK 走到最远的那个请求就掉头。`,param:`调度算法`},{act:`选 SSTF，看请求集中在磁头一侧时`,watch:`总是就近取，远端的请求可能一直排不上 —— 饥饿。`,param:`调度算法`},{act:`改初始方向`,watch:`SCAN / C-SCAN 的总路程随方向变化很大，题目里这个条件不能漏读。`,param:`初始方向`}],terms:[`seek`,`scan`]},sort:{question:`七种排序，每一趟之后数组长什么样？哪些位置是真定了？`,read:[{at:`柱状数组`,is:`当前状态。深色是**已确定最终位置**，浅色只是**暂时有序、后面还会动**。`},{at:`空出来的那一格`,is:`挖坑法：手里正端着一个值，坑还没填上 —— 所以数组看起来会"少一个"。`},{at:`逐趟结果页签`,is:`每一趟结束时的快照，考试问的常常就是这个。`}],try:[{act:`切到直接插入，再切到冒泡`,watch:`插入的前缀只是"暂时有序"，冒泡的后缀才是"真的定了" —— 两者在图上颜色不同。`,param:`排序算法`},{act:`把序列改成已经有序的`,watch:`插入排序几乎不动，快排反而退化 —— 划分次数最多。`}],terms:[`stable`,`pass`,`settled`]},dijkstra:{question:`从一个点出发，到每个点的最短路是怎么一步步定下来的？`,read:[{at:`图`,is:`结点上的数字是当前记录的最短距离，加粗的边是最短路径树。`},{at:`逐轮距离表`,is:`每一轮：选中谁、松弛了谁、哪些距离被改小了。`}],try:[{act:`换源点`,watch:`最短路径树整棵变样 —— 它是"从这个源点看"的树，不是图的固有属性。`,param:`源点`},{act:`把某条边的权改大`,watch:`如果它在树上，树会改道；如果不在，多半什么也不变。`}],terms:[`relax`,`sptree`]},banker:{question:`现在把资源分出去，会不会走进死锁？`,read:[{at:`资源矩阵`,is:`Max 是声明的最大需求，Allocation 是已经给的，Need 是还差的（自动算，不用填）。`},{at:`安全性检查页签`,is:`逐轮找"Need 能被当前可用量满足"的进程，找到就假设它跑完并归还。`},{at:`最后一步`,is:`找得到全排列就是安全，并给出安全序列；卡住就是不安全。`}],try:[{act:`把某个进程的 Max 调大`,watch:`Need 跟着变大，可能就再也凑不出安全序列了 —— 结论从"安全"翻成"不安全"。`},{act:`把资源总量调小`,watch:`可用量变少，安全序列的顺序会跟着换。`}],terms:[`safeseq`,`needmax`,`deadlock`]},arq:{question:`帧丢了之后，回退 N 和选择重传各要重发多少个？`,read:[{at:`时空图`,is:`左边是发送方、右边是接收方。斜线是帧，红色是丢掉的。`},{at:`窗口状态页签`,is:`发送窗口此刻滑到哪儿、哪些已确认。`}],try:[{act:`在 GBN 和 SR 之间切（同一组丢包事件）`,watch:`GBN 把丢的那个后面全部重发一遍，SR 只补那一个 —— 传输次数差出来的就是代价。`},{act:`把窗口调大`,watch:`GBN 的代价随窗口变大而变大，因为一丢就要回退更多。`}],terms:[`gbnsr`,`cumack`]},float:{question:`一个十进制小数，怎么变成 32 位里的那一串 0 和 1？`,read:[{at:`位域拆解`,is:`符号 1 位 / 阶码 8 位 / 尾数 23 位（单精度）。鼠标停在某段能看到它的值。`},{at:`推导链页签`,is:`七步：定符号、转二进制、规格化、算阶码、取尾数、拼起来、验证。`}],try:[{act:`把数改成 0.1`,watch:`二进制是无限循环的，尾数只能截断 —— 这就是浮点误差的来源，验证那一步会显示回读的真实值。`},{act:`切到 double`,watch:`阶码 11 位、尾数 52 位，偏置从 127 变成 1023。`,param:`精度`},{act:`切到 add`,watch:`四步：对阶（小阶向大阶看齐）、尾数相加、规格化、舍入。`,param:`做什么`}],terms:[`exp`,`mant`,`bias`,`normal`]},pipeline:{question:`有数据冒险的时候，五段流水线要停几拍？前递能省下几拍？`,read:[{at:`时空图`,is:`横轴是周期，每一行是一条指令，格子里是它这个周期在哪一段。`},{at:`带斜纹的格子`,is:`停顿（气泡）。它后面的指令跟着一起停。`}],try:[{act:`把数据前递从 0 切到 1`,watch:`停顿的格子少掉一批，总周期数明显下降 —— 省下来的就是前递的价值。`,param:`数据前递`},{act:`数一数总周期`,watch:`理想情况是「段数 + 指令数 − 1」，多出来的每一拍都能在图上找到对应的那个气泡。`}],terms:[`pipeline`,`hazard`,`forward`]},vm:{question:`一个虚地址，要走几步、访问几次内存，才变成物理地址？`,read:[{at:`转换链`,is:`拆地址 → 查 TLB →（没中就）查页表 → 拼物理地址。`},{at:`位域`,is:`低位是页内偏移，高位是页号。偏移原样搬过去，只有页号被翻译。`}],try:[{act:`把页大小从 4096 改成 1024`,watch:`偏移从 12 位缩到 10 位，页号变长 —— 页表项也就更多。`,param:`页大小`},{act:`把 TLB 项数调小`,watch:`TLB 命中率掉下来，访存次数上去。`,param:`TLB 项数`}],terms:[`page`,`tlb`,`vaddr`]},multiply:{question:`乘法和除法在硬件里是怎么一位一位做出来的？`,read:[{at:`寄存器视图`,is:`每一轮之后各寄存器的值，加粗的是这一轮变了的。`},{at:`逐轮表`,is:`每一轮判断了什么、做了加还是减、移了几位。`}],try:[{act:`在三种算法之间切`,watch:`原码一位乘要先取绝对值最后再定符号；Booth 直接处理带符号数；加减交替是除法。`,param:`算法`},{act:`把位数从 4 调到 8`,watch:`轮数跟着变成 8 —— 一
