  <!--
    外观：随系统 / 白天 / 黑夜。真源是平台的 localStorage["xm-theme"]
    （主站 lib/theme.ts），主站、虾米看股、虾米看AI 都照它走。

    **必须内联、必须在 <head> 里、必须同步执行。** React 挂载时浏览器已经画过
    一帧了 —— 那一帧用的是默认的浅色，于是选了黑夜的人每翻一页都要先被闪一下白，
    而闪白正是这个功能要消灭的东西。

    **只读手动选的那一档。** 「随系统」= 把标记删掉，不是在这里算出一个 light/dark
    写进去 —— 算出来的是一张拍下来那一刻的快照，系统入夜自动转深色时页面反而不跟了。
    跟随系统由 CSS 的 prefers-color-scheme 直接管住，不需要 JS。

    这段与主站 lib/theme.ts 的 THEME_BOOT_SCRIPT 是同一段；子应用各自内联一份拷贝，
    因为它们构建时拿不到主站的模块。改那边要改这边。
  -->

sx)(`section`,{className:`whyband`,"aria-label":`这一步为什么是这样`,children:e.map(e=>(0,E.jsxs)(`div`,{className:`wseg`,children:[(0,E.jsx)(`b`,{className:`wk`,children:e.k}),(0,E.jsx)(`p`,{className:`wv`,children:Ri(e.v)})]},e.k))})}var Bi=[{at:`左边的目录`,is:`30 个实验，按四门课分组。点一个就换一整屏。`,anchor:`.nav`},{at:`上面的页签`,is:`同一件事的几种看法 —— 换页签不会重跑，只是换个角度看同一条轨迹。`,anchor:`.tabs`},{at:`中间的舞台`,is:`这个算法此刻的样子。它永远只画"当前这一步"，往前往后都由下面那条轴决定。`,anchor:`.stagewrap`},{at:`轴`,is:`整条推演被切成一步一步。点任意一格跳到那一步；柱子高低是那一步的某个量，柱子上方写着量的是什么。`,anchor:`.axis`},{at:`逐步日志`,is:`每一步一句话，说清这一步发生了什么。点某一行也能跳过去。`,anchor:`.card.log`},{at:`真题`,is:`选一道，实验会自动切成题目的配置。答完能跳回轨迹里看为什么；答错的会进错题本。`,anchor:`.card.prob`},{at:`参数`,is:`改了立刻重跑整条轨迹 —— 不是改画面，是换一个题面重新算一遍。`,anchor:`.body.params`,need:`params`},{at:`读数`,is:`当前这一步的关键数字。它们全部从轨迹派生，不是另算的 —— 所以跟舞台上看到的必然一致。`,anchor:`.card.readouts`},{at:`访问序列`,is:`驱动这个实验的那串数据，可以直接改。半截的、不合法的输入不会喂给仿真，仿真停在上一次有效的地方。`,anchor:`.seqin`,need:`sequence`},{at:`实体表`,is:`题面数据（进程表 / 边表 / 资源矩阵…），可以改、可以加减行。改完立刻重算。`,anchor:`.enttab`,need:`entities`},{at:`「边界」那一格`,is:`这个仿真**没有**模拟什么 —— 免得你拿它当全部事实。`,anchor:`.bounds`}],Vi=[{id:`hit`,term:`命中 / 缺失`,gloss:`要的数据已经在 Cache 里叫命中，不在就是缺失，得从内存搬一块进来。轴上绿色是命中、红色是缺失。`},{id:`setassoc`,term:`组相联`,gloss:`看中间那张表：**左边标着「组 0」「组 1」的每一行是一个「组」；一行里并排的那几个方框，一个方框就是一条「路」**。地址中间那几位算出去哪一行 —— 行是定死的，进哪个方框随便挑。相联度就是一行里有几个方框。`},{id:`direct`,term:`直接映射`,gloss:`相联度 = 1，每行只剩一个方框。行号一算出来，位置就唯一了 —— 那个方框被别人占着，就只能把它挤掉。`},{id:`fullassoc`,term:`全相联`,gloss:`整张表只剩一行，哪个方框都行。命中率最好，代价是每次要把**所有方框**的 tag 都比一遍 —— 硬件贵就贵在这儿。`},{id:`tagidx`,term:`tag / index / offset`,gloss:"一个地址切三段，**从右往左**读：最右边 `offset` 选这一块里的第几个字节；中间 `index` 选去哪一**组**；剩下左边那段是 `tag`，跟着块一起存进格子里 —— 下次拿它比一比，就知道格子里现在装的是不是你要的那一块。**tag 是编号不是地址**，所以屏幕上它不带 0x。"},{id:`blockway`,term:`内存块 / 组 / 路`,gloss:'**内存块**：主存按"块大小"切成一块块，搬运以它为单位。**组**（set）：Cache 分成若干组，图上一行就是一组，`index` 算出该进哪一组、没得挑。**路**（way）：一组里并排的那几个格子，每格装一个内存块 —— "2 路"就是一组有两个格子，真机常见 4 路、8 路。'},{id:`lru`,term:`LRU / FIFO`,gloss:`组满了挤谁走。LRU 挤最久没被用的，FIFO 挤最早进来的。LRU 通常更好，但要记访问时间。`},{id:`locality`,term:`局部性`,gloss:`刚用过的还会再用（时间局部性）、旁边的马上要用（空间局部性）。Cache 全靠这两条才有意义。`},{id:`exp`,term:`阶码`,gloss:`IEEE 754 里表示"小数点挪了几位"的那一段。存的是加过偏置的移码，不是原码。`},{id:`mant`,term:`尾数`,gloss:`有效数字那一段。规格化之后整数位恒为 1，所以那个 1 不存，叫隐含位。`},{id:`bias`,term:`移码 / 偏置`,gloss:`阶码存的是「真值 + 127」（单精度）。这样全 0 最小、全 1 最大，比大小可以直接按无符号比。`},{id:`normal`,term:`规格化`,gloss:`把尾数挪成 1.xxx 的形式，阶码相应加减。加减法对阶之后也要重新规格化。`},{id:`booth`,term:`Booth 算法`,gloss:`看相邻两位的组合决定加、减还是只移位，一次处理一位但能直接算带符号数，不用先取绝对值。`},{id:`restore`,term:`加减交替法`,gloss:`也叫不恢复余数法。余数为负时不退回去，下一步改成加法补偿 —— 省掉一次恢复操作。`},{id:`pipeline`,term:`流水线 / 段`,gloss:`一条指令拆成取指、译码、执行、访存、写回五段，不同指令的不同段同时进行。理想情况下每周期出一条。`},{id:`hazard`,term:`数据冒险`,gloss:`后一条指令要用的值，前一条还没写回去。只能等，或者用前递把值直接送过去。`},{id:`forward`,term:`前递（旁路）`,gloss:`不等写回，把运算结果直接从上一段送到下一段的输入。能消掉大部分停顿。`},{id:`page`,term:`页 / 页框`,gloss:`虚存把地址空间切成等大的「页」，物理内存切成同样大的「页框」。页表记的就是哪一页放在哪一框。`},{id:`tlb`,term:`TLB`,gloss:`页表项的小缓存。命中就省掉一次访存；不命中才去查页表，查完把结果塞回 TLB。`},{id:`vaddr`,term:`虚地址拆分`,gloss:`低位是页内偏移（页多大就占几位），高位是页号。偏移原样搬到物理地址上，只有页号要查表翻译。`},{id:`pagefault`,term:`缺页`,gloss:`要访问的页不在内存里，得从磁盘调进来。物理块满了就要按置换算法挤走一页。`},{id:`belady`,term:`Belady 异常`,gloss:`物理块给多了，缺页反而更多。FIFO 会出现，LRU 和 OPT 不会 —— 这是它们的分水岭。`},{id:`opt`,term:`OPT / CLOCK`,gloss:`OPT 挤"以后最久不用的"，需要预知未来，只能当理论上界。CLOCK 是 LRU 的近似：给每页一个使用位，转着圈找位是 0 的。`},{id:`turnaround`,term:`周转时间 / 带权`,gloss:`周转 = 完成时刻 − 到达时刻。带权周转 = 周转 ÷ 服务时间，衡量"等得值不值"。`},{id:`preempt`,term:`抢占 / 时间片`,gloss:`抢占是可以打断正在跑的进程。RR 按固定时间片轮着来，SRTF 一有更短的来了就抢。`},{id:`seek`,term:`寻道`,gloss:`磁头从当前磁道移到目标磁道。寻道时间是磁盘访问的大头，所以调度算法就是在省磁头的路程。`},{id:`scan`,term:`SCAN / LOOK / C-SCAN`,gloss:`SCAN 走到磁盘边界才掉头，LOOK 走到最远的请求就掉头，C-SCAN 到头之后直接回到另一端单向再来一遍。`},{id:`safeseq`,term:`安全序列`,gloss:`存在一个进程排列，按这个顺序每个进程都能拿到它还差的资源、跑完、把资源还回来。找得到就是安全状态。`},{id:`needmax`,term:`Max / Allocation / Need`,gloss:`Max 是进程声明的最大需求，Allocation 是已经给它的，Need = Max − Allocation 是它还差的。`},{id:`deadlock`,term:`死锁`,gloss:`一组进程各自拿着一部分资源、又都在等别人手里的，谁也走不了。银行家算法是在事前避免进入这种状态。`},{id:`fragment`,term:`外碎片 / 内碎片`,gloss:`外碎片是分区之间零散的小空闲，加起来够用但连不成一块。内碎片是分给你却用不上的那部分。`},{id:`fitpolicy`,term:`首次 / 最佳 / 最坏 / 邻近适应`,gloss:`从头找第一个够大的 / 找最小的够大的 / 找最大的那块 / 从上次停的地方接着找。四种在同一串请求下会分到完全不同的地址。`},{id:`inode`,term:`混合索引`,gloss:`inode 里前几个指针直接指数据块，再往后是一级、二级、三级间址。小文件一次访问就到，大文件多绕几层。`},{id:`semaphore`,term:`信号量 / PV`,gloss:`P 是申请（减一，不够就阻塞），V 是释放（加一）。生产者消费者里 empty/full 数格子、mutex 保互斥。`},{id:`pvorder`,term:`P 操作的顺序`,gloss:`必须先 P 资源信号量（empty/full）再 P 互斥（mutex）。反过来会抱着锁去睡觉，直接死锁 —— 这个实验能让它真的死给你看。`},{id:`bitmap`,term:`位示图`,gloss:`一位对应一个盘块，0 空闲 1 已用。分配就是找 0，回收就是置 0，关键是位号跟盘块号怎么换算。`},{id:`stable`,term:`稳定性`,gloss:`相等的元素排完之后相对次序有没有变。冒泡、插入、归并稳定；快排、堆、选择、希尔不稳定。`},{id:`pass`,term:`趟`,gloss:`一轮完整的处理。冒泡每趟确定一个最大值，插入每趟把一个元素插进前面的有序段。`},{id:`settled`,term:`已定位 / 局部有序`,gloss:`两回事：冒泡、选择、快排、堆每趟能**确定**某些元素的最终位置；插入、希尔、归并只是让一段**暂时有序**，后面还会动。`},{id:`relax`,term:`松弛`,gloss:`Dijkstra 的核心动作：如果"经过刚确定的点再到 v"比现在记的距离短，就更新它。`},{id:`sptree`,term:`最短路径树`,gloss:`每个点记住"我是从谁那儿被松弛到最短的"，这些边连起来就是一棵树。`},{id:`bf`,term:`平衡因子`,gloss:`左子树高 − 右子树高。AVL 要求每个结点的绝对值不超过 1，超了就旋转。`},{id:`rotate`,term:`LL / RR / LR / RL`,gloss:`按"失衡结点往下两步的方向"命名。同向（LL/RR）转一次，异向（LR/RL）要先把下面掰同向再转，一共两次。`},{id:`border`,term:`B+ 树的阶`,gloss:`m 阶最多 m−1 个键，满了就分裂、把中间的键提到父结点。所有真数据都在叶子层，叶子还串成链表。`},{id:`asl`,term:`ASL`,gloss:`平均查找长度：把每个关键字查到它所需要比较的次数平均一下。散列表比的就是这个。`},{id:`collide`,term:`拉链 / 开放定址`,gloss:`冲突了挂成链表，还是在表里另找一个空槽。后者又分线性探测、平方探测、再散列。`},{id:`clustering`,term:`堆积（聚集）`,gloss:`线性探测的老毛病：冲突的元素挤成一片连续的占用，后来的一撞就要探很多次。平方探测就是为了打散它。`},{id:`wpl`,term:`WPL`,gloss:`带权路径长度 = Σ(权值 × 到根的层数)。哈夫曼树让它最小，而且它恰好等于所有内部结点权值之和。`},{id:`prefix`,term:`前缀码`,gloss:`任何一个编码都不是另一个的前缀，所以码流不用分隔符也能唯一解码。哈夫曼编码天然是前缀码。`},{id:`next`,term:`next 数组`,gloss:`模式串每个位置上"最长的相等前后缀"有多长。失配时靠它决定模式串往右滑多远。`},{id:`noback`,term:`主串不回退`,gloss:`KMP 相对暴力法的全部好处：主串的指针只往前走，失配时只挪模式串。`},{id:`mst`,term:`最小生成树`,gloss:`连通所有点、总权值最小的那棵树。Prim 从一个点长出去，Kruskal 从最小的边挑起，两者总权值必然相同。`},{id:`cycle`,term:`环 / 连通`,gloss:`Kruskal 每挑一条边都要问"加了会不会成环"；Prim 每次只从"已经连上的那堆"往外挑。`},{id:`topo`,term:`拓扑序`,gloss:`把有向无环图排成一列，使每条边都从前指向后。做法是反复取出入度为 0 的点。`},{id:`aoe`,term:`AOE 网 / ve / vl`,gloss:`边表示活动、点表示事件。ve 是事件最早能发生的时刻（正推取最大），vl 是最迟不影响工期的时刻（逆推取最小）。`},{id:`critical`,term:`关键路径`,gloss:`余量为 0 的活动串起来的那条路。它决定整个工程的最短工期，拖它一天整体就晚一天。`},{id:`dfsbfs`,term:`DFS / BFS`,gloss:`深度优先一条路走到黑，用栈；广度优先一圈一圈铺开，用队列。图不连通时都要从新的起点重来。`},{id:`cwnd`,term:`拥塞窗口 cwnd`,gloss:`发送方自己估出来的"网络能吃下多少"。真正能发多少是它和接收窗口里的较小者。`},{id:`ssthresh`,term:`慢启动阈值 ssthresh`,gloss:`慢启动和拥塞避免的分界线。cwnd 小于它就翻倍涨，达到之后改成每轮 +1。丢包时它被砍成一半。`},{id:`phases`,term:`慢启动 / 拥塞避免 / 快恢复`,gloss:`指数涨 / 线性涨 / 三次重复 ACK 后不回到慢启动而是减半接着线性涨（Reno）。超时才回慢启动。`},{id:`gbnsr`,term:`GBN / SR`,gloss:`回退 N：一个丢了后面全部重传，接收方只按序收。选择重传：只重传丢的那个，接收方能缓存乱序到达的。`},{id:`cumack`,term:`累积确认`,gloss:`ACK n 表示"n 之前的我全收到了"。GBN 用它；SR 是逐帧确认，不累积。`},{id:`crc`,term:`CRC / 生成多项式`,gloss:`把数据当成多项式除以约定的生成多项式，余数当校验位附在后面。收端整除得 0 就认为没错。`},{id:`hamming`,term:`海明码 / 校验子`,gloss:`在 2 的幂次位上插校验位，每位负责一组数据位。收端算出的校验子恰好等于出错位的位号 —— 所以能纠一位。`},{id:`mask`,term:`子网掩码 / CIDR`,gloss:`掩码里连续的 1 划出网络号、0 是主机号。/26 就是前 26 位是网络号，剩 6 位给主机（去掉全 0 全 1 两个）。`},{id:`longest`,term:`最长前缀匹配`,gloss:`路由表里可能有多条都匹配，选掩码最长（最具体）的那条。`},{id:`handshake`,term:`三次握手 / 四次挥手`,gloss:`建连要三步是因为得双向确认初始序号；断连要四步是因为两个方向各自关，中间可以只关一边。`},{id:`timewait`,term:`TIME_WAIT`,gloss:`主动关闭方最后要等 2MSL：一是保证最后那个 ACK 送到，二是让旧连接的迷路报文自然消亡。`},{id:`csma`,term:`CSMA/CD`,gloss:`先听后发、边发边听、冲突就停、随机等一会儿再来。只用于共享介质的以太网。`},{id:`backoff`,term:`二进制指数退避`,gloss:`第 k 次冲突就从 0 到 2^k−1 里随机挑一个数，等这么多个争用期。冲突越多等得越久，16 次后放弃。`}],Hi={cache:{question:`同一串内存地址，Cache 怎么摆能少跑几趟内存？`,basics:[{title:`先分清三个词：内存块 / 组 / 路`,body:`**内存块** —— 主存按块大小（此处 16B）划分为等长的块，调入调出均以块为单位：访问 0x210 将把 0x210~0x21F 整块调入。地址 ÷ 块大小即该地址所属的**块号**。　**组**（set） —— Cache 划分为若干组，图中一行即一组。内存块映射到哪一组由块号对组数取模**唯一确定**，不可选择。　**路**（way） —— 同一组内并列的若干存储位置，每一路存放一个内存块。"2 路"即每组有两个位置；实际处理器中常见 4 路、8 路。`},{title:`tag / index / offset 各管一件事`,body:"地址划分为三段：**Index 决定去哪组，Tag 决定是不是它，Offset 决定取块里的哪个字节**。　`index` 唯一确定检索的组，其余组不参与比较；`offset` 指出块内的字节位置；剩余高位为 `tag`，随块一同存入该路。　tag 的必要性在于：**多个不同的内存块会映射到同一组**（0x10、0x110、0x210 的组号均为 1）。它们共用同一组的若干路，只能依据 tag 判定某一路当前存放的是否为目标块。　**tag 是编号而非地址**，故界面上不加 0x 前缀。"}],step:(e,t)=>{let n=e,r=e=>`0x`+e.toString(16).toUpperCase(),i=Number(t.params.associativity)||1,a=n.outcome===`hit`;return[{k:`本步输入`,v:`内存地址 **${r(n.address)}**`},{k:`判定规则`,v:`由地址的 index 段得到组号 **${n.setIndex}**，检索范围限定为组 ${n.setIndex}；将该组 ${i} 路各自保存的 tag 与地址 tag 段的值 **${n.tag}** 逐一比较。`},{k:`本步结果`,v:a?`第 ${n.wayUsed+1} 路的 tag 等于 ${n.tag}，判定为**命中**：所需数据块已在 Cache 中，本次访问不需访问主存。`:n.evictedTag===null?`该组 ${i} 路的 tag 均不等于 ${n.tag}，判定为**缺失**：从主存调入该块，写入组 ${n.setIndex} 中空闲的第 ${n.wayUsed+1} 路。`:`该组 ${i} 路的 tag 均不等于 ${n.tag}，判定为**缺失**；该组 ${i} 路均已占用，按替换策略淘汰 tag 为 ${n.evictedTag} 的那一路，调入的新块占用其位置。`},{k:`对应画面`,v:a?`组 ${n.setIndex} 第 ${n.wayUsed+1} 路：绿色边框，标记「=」。`:n.evictedTag===null?`组 ${n.setIndex} 第 ${n.wayUsed+1} 路：红色边框，标记「装入」。`:`组 ${n.setIndex} 中红色边框的那一路；其下方划除的 tag ${n.evictedTag} 为被淘汰的块。`}]},read:[{at:`上面那条彩色的位串`,is:`当前访问的地址被切成三段：标记 / 组号 / 块内偏移。`,anchor:`.bitrow`},{at:`中间那张表`,is:`这就是 Cache 本身。**左边标着「组 N」的一行是一个组，一行里并排的方框，一个就是一条路**；虚线箭头指着这次的地址落到哪一行。方框里写的是 tag —— 它跟你地址左边那段一样，就是命中。`,anchor:`.sets`},{at:`轴上的柱子`,is:`到这一步为止的滚动命中率 —— 绿格命中、红格缺失。`,anchor:`.axis`}],try:[{act:`把相联度从 2 调到 1`,watch:`表从 8 行、每行 2 个方框，变成 16 行、每行 1 个，地址里中间那段变长、tag 段变短。**先看命中率变没变** —— 这串地址上它可能一点不动；想看出差别，换下面那串「同组冲突」。`,param:`相联度`},{act:`换成「同组冲突」预置序列`,watch:`这串地址全落在同一组 —— 相联度 1 时几乎全红，调到 4 就几乎全绿。`,preset:`同组冲突`},{act:`把块大小从 16 调到 64`,watch:`块内偏移占的位变多、组号变少；顺序访问会因为"搬一块就带进来好几个"而变好。`,param:`块大小`}],terms:[`hit`,`blockway`,`setassoc`,`direct`,`fullassoc`,`tagidx`,`lru`,`locality`]},scheduler:{question:`同一批进程，换个调度算法，谁先跑完、平均等多久？`,read:[{at:`甘特图每一行`,is:`一个进程。深色格是它在 CPU 上跑，浅色是就绪等待。`,anchor:`.gantt`},{at:`进程表`,is:`题面数据：到达时刻和服务时间。可以直接改，也可以加一行。`,anchor:`.enttab`},{at:`右边读数`,is:`当前时刻在跑谁、就绪队列里排着谁、还剩多少。`,anchor:`.readouts`}],try:[{act:`装上「护航效应」预置，在 FCFS 和 SJF 之间切`,watch:`长作业排在前面时 FCFS 的平均周转明显吃亏 —— 后面一串短作业全被它堵着。`,param:`调度算法`,preset:`护航效应`},{act:`选 RR，再把时间片从 2 调到 1`,watch:`切换次数翻倍，甘特图变碎；时间片越小越"公平"，但切换开销也越大。`,param:`时间片`},{act:`选 SRTF`,watch:`每来一个更短的作业就抢占，甘特图上会看到正在跑的被打断。`,param:`调度算法`}],terms:[`turnaround`,`preempt`]},tcp:{question:`一条 TCP 连接遇到丢包，发送窗口是怎么涨、怎么砍的？`,step:(e,t)=>{let n=e,r=String(t.params.variant),i={slowStart:`慢启动`,congestionAvoidance:`拥塞避免`, 转反而更长。这一屏把甘特图摊开，让你看见每一秒 CPU 在谁手上。`,guess:{q:`RR（时间片轮转）把时间片从 2 调到 1，平均周转时间会怎样？`,opts:[`变短`,`不变`,`变长`]},tasks:[{act:`把「调度算法」切成 RR，时间片留 2，走完整条轴`,watch:`甘特图上进程被切成一段一段 —— 谁都不用等太久才第一次上 CPU`,param:`调度算法`},{act:`把「时间片」从 2 拧到 1`,watch:`切得更碎了。看最后完成时刻 —— 每个人第一次上 CPU 更快，但**做完**更慢`,param:`时间片`},{act:`切回 SRTF，对比甘特图`,watch:`它总是让"剩得最少"的先跑，所以平均周转最短 —— 代价是它得预知还要跑多久`,param:`调度算法`}],goal:{say:`不用 SJF / SRTF（真实 OS 预知不了运行时间），把平均周转压到 9.0 以下`,state:({doc:e,trace:t})=>{let n=zo(t,e);if(n===null)return null;let r=String(e.params.algorithm??``),i=r!==`SJF`&&r!==`SRTF`;return{now:`${r||`?`} · 平均周转 ${n.toFixed(2)}`,met:i&&n<9,miss:i?n>=9?`还差 ${(n-9).toFixed(2)}`:void 0:`这条不算 —— 真实 OS 预知不了运行时间`}}},verdict:({doc:e,trace:t,runDoc:n})=>{if(zo(t,e)===null)return null;let r=(t,r)=>{let i={...e,params:{...e.params,algorithm:t,quantum:r}};return zo(n(i),i)},i=r(`RR`,2),a=r(`RR`,1),o=r(`SRTF`,2),s=r(`FCFS`,2);if(i===null||a===null||o===null||s===null)return null;let c=e=>e.toFixed(2),l=a<i?0:a===i?1:2;return{pick:l,say:`你这张进程表：RR 时间片 2 的平均周转是 ${c(i)}，时间片 1 是 ${c(a)} —— 所以「${[`变短`,`不变`,`变长`][l]}」。`,why:l===2?`时间片越小切换越频繁，每个进程都被拖得更晚做完 —— **RR 换来的不是周转，是响应**：它保证你很快能第一次上 CPU，不保证你早点做完。对照一下：SRTF ${c(o)}、FCFS ${c(s)}，连最朴素的 FCFS 都比 RR 的周转短。`:`这张表上时间片调小没吃亏 —— 换一张服务时间差距更大的表（比如「护航效应」）再看一次，RR 拿周转换响应的代价才显出来。对照：SRTF ${c(o)}、FCFS ${c(s)}。`}}},pipeline:{care:`一条指令要走取指、译码、执行、访存、写回五段。流水线让五条指令**同时各占一段**，理论上每个周期就能完成一条 —— 但只要后一条要用到前一条刚算出的结果，它就得**等**，这一等就是一个气泡。这一屏把每个周期每条指令在哪一段摊开：你能看见气泡从哪儿冒出来、前递怎么把它填掉，以及哪一种相关**前递也救不了**。`,guess:{q:`打开「数据前递」，这四条指令跑完的总周期会少几个？`,opts:[`一个都不少`,`少 1～2 个`,`少 5 个以上`]},tasks:[{act:`先关着前递走完整条轴`,watch:`甘特图上一格一格的「气泡」—— 数一数有几个`,param:`数据前递`},{act:`把「数据前递」打开，再走一遍`,watch:`气泡少了多少，总周期从几变到几`,param:`数据前递`},{act:`换成「load-use」那组指令，再开一次前递`,watch:`这一个气泡**填不掉** —— lw 的结果要到访存段才出来，前递也来不及`,preset:`load-use`}],goal:{say:`把这段指令的总周期压到 10 个以内`,state:({trace:e})=>{let t=Bo(e);return t===null?null:{now:`${t} 个周期`,met:t<=10}}},verdict:({doc:e,trace:t,runDoc:n})=>{if(Bo(t)===null)return null;let r=t=>Bo(n({...e,params:{...e.params,forwarding:t}})),i=r(0),a=r(1);if(i===null||a===null)return null;let o=i-a,s=o===0?0:o<=2?1:2;return{pick:s,say:`你这段指令：不前递要 ${i} 个周期，开前递要 ${a} 个 —— 省了 ${o} 个，所以「${[`一个都不少`,`少 1～2 个`,`少 5 个以上`][s]}」。`,why:o===0?`这组指令互不依赖，本来就没有气泡 —— 前递是用来填气泡的，没有气泡它就没活干。周期数这时等于 段数 + (指令数 − 1)，那是流水线的理论下限。`:"省下的每一个周期都是一个被填掉的气泡：前递把结果**从算完的那一段直接接到要用的那一段**，不用等它先写回寄存器。但有一种救不了 —— `lw` 的结果要到访存段才出来，紧接着就用它的那条指令必须停一拍，那个气泡是硬的。"}}},vm:{care:`程序里写的地址是**虚**的，真正去内存拿数据得先translate成物理地址 —— 这一步每次访存都要做。要是每次都去内存查页表，一次访存就变成两次 —— 先取页表项，再取数据。TLB 就是为此存在的：一个很小的、专门缓存"虚页号 → 物理页框"的表。这一屏把每一次地址转换摊开：命中 TLB、退回查页表、还是干脆缺页要去磁盘搬。`,guess:{q:`TLB 从 2 项加到 4 项，这串地址的 TLB 命中次数会变多吗？`,opts:[`会变多`,`不变`,`反而变少`]},tasks:[{act:`把「TLB 项数」从 1 一路拧到 8`,watch:`读数里的「TLB 命中」和「查页表」—— 哪一档开始变，哪一档之后不再变`,param:`TLB 项数`},{act:`换成「TLB 抖动」那串地址`,watch:`每次都刚好把上一次要用的那项挤掉 —— TLB 再大一点就能救`,preset:`TLB 抖动`},{act:`把「页大小」从 4096 改成 1024`,watch:`同一串地址落到更多的页上，TLB 要装的东西变多了`,param:`页大小`}],goal:{say:`让 TLB 命中达到 2 次或更多`,state:({trace:e})=>{let t=Vo(e);return t===null?null:{now:`TLB 命中 ${t.tlb} 次`,met:t.tlb>=2}}},verdict:({doc:e,trace:t,runDoc:n})=>{if(Vo(t)===null)return null;let r=t=>Vo(n({...e,params:{...e.params,tlbEntries:t}})),i=r(2),a=r(4),o=r(8);if(!i||!a||!o)return null;let s=a.tlb>i.tlb?0:a.tlb===i.tlb?1:2;return{pick:s,say:`你这串地址：TLB 2 项时命中 ${i.tlb} 次，4 项时命中 ${a.tlb} 次 —— 所以「${[`会变多`,`不变`,`反而变少`][s]}」。`,why:o.tlb>a.tlb?`再加到 8 项还能涨到 ${o.tlb} 次 —— 说明这串地址的**复用距离**还超过 4：一个页被再次用到之前，中间隔了太多别的页，小 TLB 装不住。`:`加到 8 项仍是 ${o.tlb} 次，不再涨了 —— 剩下的缺失不是"装不下"，是**第一次访问必然要查一次页表**。这一类靠加大 TLB 救不了，就像 Cache 的强制缺失靠加相联度救不了一样。`}}},multiply:{care:`这一屏模拟的是**串行乘法器**：没有一次算完的乘法电路，只能用加法和移位一位一位地凑。（现代 CPU 当然有乘法指令，底下是流水线阵列乘法器 —— 但它的原理仍然是把这些部分积一次并行加起来。）所以两个数相乘要**一位一位地判、加、移**，判断乘数的这一位是 1 就加、是 0 就不加，然后整体右移，做多少位就转多少轮。负数更麻烦：原码乘要把符号单拎出来算，Booth 则靠一个"附加位"让正负数走同一套流程。这一屏把寄存器里每一轮的部分积摊开 —— 你会看见"乘法"其实就是一串加法。`,guess:{q:`Booth 算法比原码一位乘，轮数会少吗？`,opts:[`Booth 更少`,`一样多`,`Booth 更多`]},tasks:[{act:`用「正 × 正」把原码一位乘走完`,watch:`每一轮：先看判断位，再决定加不加，最后整体右移`,preset:`正 × 正`},{act:`切到 Booth，同一组数再走一遍`,watch:`轮数一样，但它多了一个「附加位」—— 判断的是**相邻两位**`,param:`算法`},{act:`换成「负 × 正」，两种算法各走一遍`,watch:`Booth 全程不用管符号；原码乘得把符号位单独拿出来算`,preset:`负 × 正`}],goal:{say:`找一对操作数，让 Booth 的加减次数**少于**原码一位乘`,state:({doc:e,runDoc:t})=>{let n=n=>qo(t({...e,params:{...e.params,algorithm:n}})),r=n(`Booth`),i=n(`原码一位乘`);return r===null||i===null?null:{now:`Booth ${r} 次 · 原码一位乘 ${i} 次`,met:r<i,miss:r<i?void 0:`还没拉开差距`}}},verdict:({doc:e,trace:t,runDoc:n})=>{let r=e=>{let t=e[e.length-1];return typeof t?.round==`number`?t.round:null};if(r(t)===null)return null;let i=t=>{let i=n({...e,params:{...e.params,algorithm:t}});return{r:r(i),steps:i.length}},a=i(`原码一位乘`),o=i(`Booth`);if(a.r===null||o.r===null)return null;let s=o.r<a.r?0:o.r===a.r?1:2;return{pick:s,say:`原码一位乘 ${a.r} 轮，Booth ${o.r} 轮 —— 所以「${[`Booth 更少`,`一样多`,`Booth 更多`][s]}」。`,why:s===1?`**Booth 的好处不在轮数**，在于它把负数的处理并进了同一套流程：原码乘要先取绝对值、算完再单独定符号，Booth 靠一个附加位判断"相邻两位"，正负数走的是同一条路。轮数是位数决定的，谁也省不掉。`:`轮数确实不同（${a.r} vs ${o.r}）—— 这一组数上 Booth 的连续 1 段被合并了，那是它另一个好处：一串连着的 1 可以用"一次减 + 一次加"代替多次加。`}}},float:{care:"`0.1 + 0.2 !== 0.3` 这件事，几乎每个写过代码的人都撞过。原因不在语言，在**存法**：浮点数用「符号 + 阶码 + 尾数」三段来存，而十进制的 0.1 换成二进制是个**无限循环小数**，尾数只有 23 位（单精度），存不下就得截断。这一屏把编码的七个步骤逐步摊开，最后把机器里真正存进去的那个数**原样念给你听**。",guess:{q:`把 0.1 用单精度存进去，再原样读出来，还是 0.1 吗？`,opts:[`是，正好 0.1`,`不是，有误差`]},tasks:[{act:`装上「0.1」这个预置，走完七步`,watch:`尾数那一段被截断的位置 —— 二进制里它是循环的`,preset:`0.1`},{act:`把「精度」从单精度切到双精度`,watch:`尾数从 23 位变成 52 位，误差小了但**没有消失**`,param:`精度`},{act:`换成「−12.5」再走一遍`,watch:`这个数的二进制是有限的，所以存得进去、误差为 0`,preset:`−12.5`}],goal:{say:`找一个数，让它**存进去再读出来就变了**（亲眼看见精度损失）`,state:({doc:e,trace:t})=>{let n=Yo(t),r=Number(e.streams?.find(e=>e.name===`operands`)?.values?.[0]);if(n===null)return null;let i=Ho(n);if(i===null||!Number.isFinite(r))return null;let a=i!==r;return{now:a?`${r} → ${i}`:`${r} 存回来还是 ${r}`,met:a,miss:a?void 0:`这个数是存得下的`}}},verdict:({doc:e,trace:t,runDoc:n})=>{let r=Yo(t);if(!r)return null;let i=Number(e.streams?.find(e=>e.name===`operands`)?.values?.[0]),a=Ho(r);if(a===null||!Number.isFinite(i))return null;let o=Math.abs(a-i),s=o===0?0:1,c=o===0?`${i} 存进去再读出来，还是 ${i} —— 这个数的二进制是有限的，一位没丢。`:`${i} 存进去，机器里实际是 **${a}** —— 误差 ${o.toExponential(3)}。`,l=Ho(Yo(n({...e,params:{...e.params,format:e.params.format===`double`?`single`:`double`}}))??``),u=e.params.format===`double`?`单精度`:`双精度`;return{pick:s,say:c,why:l===null?`（另一档精度这次没算出来）`:o===0?`换成${u}也是 ${l} —— 有限小数在哪一档都存得下。会出问题的是 0.1 那种：十进制有限、二进制无限。`:`换成${u}存，实际是 ${l}，误差 ${Math.abs(l-i).toExponential(3)} —— **小了很多，但仍然不是 0**。位数只能把误差往后推，推不到没有：二进制里除不尽的数，给多少位都除不尽。`}}},tcp:{care:`网络会堵，而没有谁会告诉发送方"慢一点"。TCP 只能自己猜：**丢包就是堵了**。于是它把发送窗口一点点试大，一丢包就砍。砍多狠、之后怎么再涨，决定了这条连接实际能用上多少带宽 —— 也决定了你下载时那条速度曲线为什么是锯齿状的。这一屏把 cwnd 每一轮的涨落画出来，两种丢包的处置差别一眼能看见。`,guess:{q:`同样这两次丢包，Reno 和 Tahoe 跑完 20 轮，谁的窗口更大？`,opts:[`Reno 更大`,`一样大`,`Tahoe 更大`]},tasks:[{act:`先按默认走完 20 轮`,watch:`曲线两次往下砍的位置 —— 第 8 轮和第 13 轮，砍法**不一样**`},{act:`把算法版本换成 Tahoe`,watch:`第 8 轮那次由"腰斩"变成"直接回到 1"，后面整条线都低了一截`,param:`算法版本`},{act:`把慢启动门限从 16 改成 4`,watch:`指数涨的那一段被砍短，很早就进了拥塞避免 —— 末窗口反而更小`,param:`慢启动门限`}],goal:{say:`让跑完 20 轮时的 cwnd 达到 12 MSS 以上`,state:({trace:e})=>{let t=Uo(e,`cwnd`);return t===null?null:{now:`cwnd ${t} MSS`,met:t>=12}}},verdict:({doc:e,trace:t,runDoc:n})=>{if(Uo(t,`cwnd`)===null)return null;let r=t=>Uo(n({...e,params:{...e.params,variant:t}}),`cwnd`),i=r(`Reno`),a=r(`Tahoe`);if(i===null||a===null)return null;let o=i>a?0:i===a?1:2;return{pick:o,say:`你这组丢包事件：Reno 跑完是 ${i} MSS，Tahoe 是 ${a} MSS —— 所以「${[`Reno 更大`,`一样大`,`Tahoe 更大`][o]}」。`,why:i===a?`这组事件里两者没拉开差距 —— 快恢复只在**三次重复 ACK** 那种丢包上才和 Tahoe 分道扬镳；如果丢包全是超时，两个版本的处置本来就一样。`:`差别只在**三次重复 ACK** 那一次：收到三个重复 ACK 说明后续的包还在到达，路还通着，Reno 因此只把 cwnd 腰斩、留在较高的位置继续线性涨（快恢复）；Tahoe 不区分，一律回到 1 重新慢启动。**超时那一次两者一样惨** —— 超时意味着连重复 ACK 都收不到，没有理由认为路还通。`}}},arq:{care:`帧会丢，而发送方只能靠"该来的 ACK 没来"发现。发现之后重发**哪些**，是回退 N 和选择重传的全部分歧：一个把丢掉那帧之后的统统重来，一个只补那一帧。窗口开得越大，这个分歧的代价就越大 —— 这一屏把每一帧的去向画成时空图，重发了几次直接数得出来。`,guess:{q:`同一组丢包，窗口都是 4，GBN 和 SR 谁的总传输次数少？`,opts:[`GBN 少`,`一样多`,`SR 少`]},tasks:[{act:`按默认（GBN · 窗口 4）走完`,watch:`时空图上丢掉那一帧之后，**后面几帧也跟着重画了一遍**`},{act:`换成 SR，别的不动`,watch:`同样的丢包，只有那一帧被补发 —— 累计传输从 12 掉到 9`,param
