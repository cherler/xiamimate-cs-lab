<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>网络机器 · 运转验证</title>
<style>
  html,body{margin:0;height:100%;background:#140f0a;overflow:hidden;font-family:sans-serif}
  #c{display:block;width:100vw;height:100vh}
  #ui{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:14px;z-index:5}
  button{background:#c0603a;color:#150d07;border:none;border-radius:10px;padding:12px 26px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  button.g{background:#2a2418;color:#c9a227;border:1px solid #5a4a2a}
  #tag{position:fixed;top:14px;left:18px;color:#c9a227;font-weight:bold;z-index:5}
  #hint{position:fixed;top:14px;right:18px;color:#8a7a5a;font-size:13px;z-index:5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag">网络机器 · 打开网页</div>
<div id="hint">按「运行请求」看它运转 —— 这是"好玩性"验证:动起来爽不爽</div>
<div id="ui"><button id="run">▶ 运行请求</button><button id="reset" class="g">重置</button></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d')
let W, H, DPR = Math.min(2, devicePixelRatio || 1)
function resize() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0) }
addEventListener('resize', resize); resize()

// 五档机器 + 每档把令牌"变形"成下一样东西(教学动线)
const STAGES = [
  { name: 'DNS解析', out: 'IP 203.0.113.5', tint: '#e0a94b' },
  { name: 'IP寻址', out: '装进IP包', tint: '#e0a94b' },
  { name: 'TCP连接', out: '通道已建', tint: '#57b6a3' },
  { name: 'TLS握手', out: '已加密🔒', tint: '#a879d6' },
  { name: 'HTTP请求', out: '网页 200 ✓', tint: '#9be29b' },
]
const rowY = () => H * 0.46
function stageX(i) { const m = 150, span = (W - 2 * m); return m + span * (i + 0.5) / STAGES.length }
const state = STAGES.map(() => ({ lit: false, spin: 0.5, angle: Math.random() * 6 }))

// 令牌
let pkt = null, sparks = [], done = false
const START_LABEL = '域名 www.example.com'

function run() {
  reset()
  pkt = { x: 60, y: rowY(), label: START_LABEL, seg: 0, phase: 'move', t: 0, glow: 1 }
}
function reset() {
  pkt = null; sparks = []; done = false
  state.forEach(s => { s.lit = false; s.spin = 0.5 })
}
document.getElementById('run').onclick = run
document.getElementById('reset').onclick = reset

function drawGear(cx, cy, r, teeth, ang, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang)
  ctx.beginPath()
  for (let i = 0; i < teeth; i++) {
    const a0 = (i / teeth) * Math.PI * 2, a1 = ((i + 0.5) / teeth) * Math.PI * 2
    const ro = r, ri = r * 0.82
    ctx.lineTo(Math.cos(a0) * ro, Math.sin(a0) * ro)
    ctx.lineTo(Math.cos(a0 + 0.12) * ri, Math.sin(a0 + 0.12) * ri)
    ctx.lineTo(Math.cos(a1) * ri, Math.sin(a1) * ri)
    ctx.lineTo(Math.cos(a1 + 0.12) * ro, Math.sin(a1 + 0.12) * ro)
  }
  ctx.closePath()
  const g = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r)
  g.addColorStop(0, color); g.addColorStop(1, '#6b4a1e')
  ctx.fillStyle = g; ctx.fill()
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5; ctx.stroke()
  ctx.beginPath(); ctx.arc(0, 0, r * 0.28, 0, 7); ctx.fillStyle = '#241a0e'; ctx.fill()
  ctx.restore()
}

function drawMachine(i) {
  const x = stageX(i), y = rowY(), s = state[i], w = 150, h = 116
  // 底座管道
  ctx.fillStyle = '#241a10'
  ctx.fillRect(x - w / 2, y - h / 2, w, h)
  // 外壳(黄铜)
  const g = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2)
  g.addColorStop(0, s.lit ? '#4a3c1e' : '#33291a'); g.addColorStop(1, '#211a10')
  ctx.fillStyle = g
  roundRect(x - w / 2, y - h / 2, w, h, 12); ctx.fill()
  ctx.lineWidth = 2.5; ctx.strokeStyle = s.lit ? STAGES[i].tint : '#5a4a2a'
  if (s.lit) { ctx.shadowColor = STAGES[i].tint; ctx.shadowBlur = 18 }
  roundRect(x - w / 2, y - h / 2, w, h, 12); ctx.stroke(); ctx.shadowBlur = 0
  // 两个啮合齿轮
  drawGear(x - 26, y - 8, 30, 12, s.angle, s.lit ? STAGES[i].tint : '#b8863a')
  drawGear(x + 26, y - 8, 22, 10, -s.angle * (30 / 22) + 0.26, s.lit ? STAGES[i].tint : '#a8763a')
  // 铭牌
  ctx.fillStyle = '#160f08'; roundRect(x - w / 2 + 12, y + h / 2 - 30, w - 24, 22, 6); ctx.fill()
  ctx.fillStyle = s.lit ? STAGES[i].tint : '#c9b58a'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'
  ctx.fillText(STAGES[i].name, x, y + h / 2 - 14)
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath() }

function pipes() {
  ctx.strokeStyle = '#3a2e1a'; ctx.lineWidth = 10; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(40, rowY()); ctx.lineTo(W - 40, rowY()); ctx.stroke()
  ctx.strokeStyle = '#241a0e'; ctx.lineWidth = 3; ctx.stroke()
}

let last = 0
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts
  ctx.clearRect(0, 0, W, H)
  // 背景暖晕
  const bg = ctx.createRadialGradient(W / 2, rowY(), 60, W / 2, rowY(), W * 0.7)
  bg.addColorStop(0, '#1c150d'); bg.addColorStop(1, '#120d08'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H)

  pipes()
  state.forEach((s, i) => { s.angle += s.spin * dt * 2.2; s.spin += (0.5 - s.spin) * dt * 2 }) // 转速回落到怠速
  for (let i = 0; i < STAGES.length; i++) drawMachine(i)

  // 令牌推进
  if (pkt) {
    if (pkt.phase === 'move') {
      const targetX = pkt.seg < STAGES.length ? stageX(pkt.seg) : W - 40
      pkt.x += (targetX - pkt.x) * Math.min(1, dt * 3.5)
      if (Math.abs(pkt.x - targetX) < 3) {
        if (pkt.seg < STAGES.length) { pkt.phase = 'proc'; pkt.t = 0; state[pkt.seg].spin = 7 }
        else { pkt.phase = 'end'; done = true }
      }
    } else if (pkt.phase === 'proc') {
      pkt.t += dt; state[pkt.seg].spin = 7
      if (Math.random() < 0.5) sparks.push({ x: pkt.x + (Math.random() - .5) * 40, y: rowY() - 8, vx: (Math.random() - .5) * 60, vy: -40 - Math.random() * 60, life: .5, c: STAGES[pkt.seg].tint })
      if (pkt.t > 0.75) { state[pkt.seg].lit = true; pkt.label = STAGES[pkt.seg].out; pkt.seg++; pkt.phase = 'move' }
    }
    // 画令牌
    const py = rowY() + 44
    ctx.save(); ctx.shadowColor = '#ffd98a'; ctx.shadowBlur = 22
    ctx.fillStyle = '#ffcf7a'; ctx.beginPath(); ctx.arc(pkt.x, py, 11, 0, 7); ctx.fill(); ctx.restore()
    ctx.fillStyle = '#150d07'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'
    const tw = ctx.measureText(pkt.label).width
    ctx.fillStyle = 'rgba(20,14,8,.85)'; roundRect(pkt.x - tw / 2 - 8, py + 14, tw + 16, 20, 6); ctx.fill()
    ctx.fillStyle = '#ffe6b0'; ctx.fillText(pkt.label, pkt.x, py + 28)
  }

  // 火花
  sparks = sparks.filter(s => s.life > 0)
  for (const s of sparks) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 160 * dt; ctx.globalAlpha = Math.max(0, s.life * 2); ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, 7); ctx.fill(); ctx.globalAlpha = 1 }

  if (done) {
    ctx.fillStyle = '#9be29b'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'
    ctx.save(); ctx.shadowColor = '#9be29b'; ctx.shadowBlur = 24
    ctx.fillText('✓ 网页打开了 —— 请求从这台机器里跑了个来回', W / 2, rowY() - 120); ctx.restore()
  }
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
