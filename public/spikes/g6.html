<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>画布 spike · AntV G6</title>
<script src="https://unpkg.com/@antv/g6@5/dist/g6.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0e1524;color:#e8e2d6;font-family:sans-serif;overflow:hidden}
  #wrap{display:flex;height:100vh}
  #lib{width:190px;flex:0 0 190px;background:#141c2b;border-right:1px solid #2a3446;padding:14px 12px;box-sizing:border-box}
  #lib h3{margin:0 0 4px;font-size:15px}
  #lib .hint{color:#7f8ba0;font-size:11px;margin-bottom:12px}
  .pill{background:#1b2740;border:2px solid #6b8c; border-radius:8px;padding:7px 10px;margin:6px 0;font-size:13px;cursor:grab;user-select:none}
  #main{flex:1;position:relative}
  #bar{position:absolute;top:10px;left:14px;z-index:5;font-size:13px;color:#9fb0c2}
  #tag{position:absolute;top:10px;right:16px;z-index:5;font-weight:bold;color:#ffcb7a}
  #canvas{width:100%;height:100%}
  .ghost{position:fixed;pointer-events:none;z-index:99;background:#24406a;border:2px solid #6b8cff;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:bold;color:#f0e9dc;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="wrap">
  <div id="lib">
    <h3>素材库</h3>
    <div class="hint">拖到画布,加到<b>选中</b>的节点下</div>
    <div id="pills"></div>
  </div>
  <div id="main">
    <div id="bar">滚轮缩放 · 拖空白平移 · 点节点折叠/展开 · 点节点选中</div>
    <div id="tag">引擎:AntV G6</div>
    <div id="canvas"></div>
  </div>
</div>
<script type="module">
import { TREE, PALETTE, LAYER_COLOR } from './tree.js'
const { Graph, treeToGraphData } = window.G6

// 兼容 G6 v5 不同数据形状:字段可能在 d.data.* 或 d.*
const nameOf = (d) => (d.data && d.data.name) ?? d.name ?? ''
const layerOf = (d) => (d.data && d.data.layer) ?? d.layer ?? '素材'
let selected = 'goal'
const graph = new Graph({
  container: 'canvas',
  data: treeToGraphData(TREE),
  autoFit: 'view',
  node: {
    type: 'rect',
    style: {
      size: [138, 40], radius: 9,
      fill: (d) => (d.id === selected ? '#24406a' : '#1a2230'),
      stroke: (d) => LAYER_COLOR[layerOf(d)] || '#6b8cff',
      lineWidth: 2,
      labelText: (d) => nameOf(d),
      labelFill: '#e6ecf5', labelFontSize: 13, labelPlacement: 'center', labelTextAlign: 'center',
    },
    animation: { update: [{ fields: ['x', 'y'], duration: 400, easing: 'ease-out' }] },
  },
  edge: { type: 'cubic-vertical', style: { stroke: '#33405a', lineWidth: 1.5 } },
  layout: { type: 'compact-box', direction: 'TB', getWidth: () => 138, getHeight: () => 40, getHGap: () => 16, getVGap: () => 40 },
  behaviors: ['drag-canvas', 'zoom-canvas', 'collapse-expand'],
})
graph.render()

// 点节点=选中(高亮)
graph.on('node:click', (e) => { selected = e.target.id; graph.draw() })

// 素材库拖拽 → 加到选中节点下
const pills = document.getElementById('pills')
let drag = null, ghost = null
for (const p of PALETTE) {
  const el = document.createElement('div')
  el.className = 'pill'; el.textContent = p.name
  el.style.borderColor = LAYER_COLOR[p.layer]
  el.addEventListener('pointerdown', (ev) => {
    drag = { ...p, uid: p.id + '_' + Date.now() }
    ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.textContent = p.name
    ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'
    document.body.appendChild(ghost)
  })
  pills.appendChild(el)
}
addEventListener('pointermove', (ev) => { if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px' } })
addEventListener('pointerup', () => {
  if (!drag) return
  const d = drag; drag = null; if (ghost) { ghost.remove(); ghost = null }
  graph.addNodeData([{ id: d.uid, data: { name: d.name, layer: d.layer } }])
  graph.addEdgeData([{ id: 'e_' + d.uid, source: selected, target: d.uid }])
  graph.render()
})
</script>
</body>
</html>
