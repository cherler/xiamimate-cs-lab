<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DNS 查号机 · 搭+跑(生图美术)</title>
<style>
  html,body{margin:0;height:100%;background:#140f0a;overflow:hidden;font-family:sans-serif}
  #c{display:block;width:100vw;height:100vh}
  #lib{position:fixed;left:0;top:0;bottom:0;width:210px;background:#1a130b;border-right:1px solid #3a2e1a;padding:14px 12px;box-sizing:border-box;z-index:5}
  #lib h3{margin:0 0 2px;color:#c9a227;font-size:15px}#lib .hint{color:#8a7a5a;font-size:11px;margin-bottom:12px}
  .pill{display:flex;align-items:center;gap:10px;background:#241a10;border:2px solid #b8863a;border-radius:10px;padding:6px 9px;margin:9px 0;color:#e8d9b8;cursor:grab;user-select:none}
  .pill img{width:38px;height:38px;object-fit:contain;pointer-events:none}
  .pill b{font-size:13px}.pill span{font-size:10px;color:#8a7a5a}
  #run{position:fixed;bottom:26px;left:calc(50% + 105px);transform:translateX(-50%);z-index:5;background:#3a2418;color:#6b5a3a;border:1px solid #4a3a22;border-radius:10px;padding:12px 30px;font-size:16px;font-weight:bold;cursor:not-allowed}
  #run.on{background:#c0603a;color:#150d07;cursor:pointer;box-shadow:0 4px 16px rgba(192,96,58,.5)}
  #tag{position:fixed;top:14px;left:226px;color:#c9a227;font-weight:bold;z-index:5}
  #status{position:fixed;top:40px;left:226px;color:#a08a5a;font-size:13px;z-index:5}
  .ghost{position:fixed;pointer-events:none;z-index:99;width:64px;height:64px;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lib"><h3>零件库</h3><div class="hint">把零件拖进机器对应的槽</div><div id="pills"></div></div>
<div id="tag">DNS 查号机</div>
<div id="status">先把三个零件拖进机器,拼齐了才能运行。</div>
<button id="run">▶ 运行</button>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d')
let W, H, DPR = Math.min(2, devicePixelRatio || 1)
function resize() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0) }
addEventListener('resize', resize); resize()

const IMG = {}
const load = (k, src) => { const i = new Image(); i.src = src; IMG[k] = i }
load('housing', './machine/housing.png'); load('gear', './machine/gear.png'); load('token', './machine/token.png')
load('域名', './machine/part-domain.png'); load('DNS服务器', './machine/part-server.png'); load('缓存', './machine/part-cache.png')

const HW = 460, HHI = HW * 1024 / 1536      // 外壳按原图比例
const HX = () => 210 + (W - 210) / 2, HY = () => H * 0.42
// 三个槽:对齐外壳图里的三个齿轮座
const slots = [
  { need: '域名', filled: false, fx: -0.205, fy: 0.05 },
  { need: 'DNS服务器', filled: false, fx: 0.0, fy: 0.05 },
  { need: '缓存', filled: false, fx: 0.205, fy: 0.05 },
]
const PARTS = [
  { id: '域名', desc: '要查的名字' }, { id: 'DNS服务器', desc: '黄页查号台' },
  { id: '缓存', desc: '查过就记住' }, { id: 'SYN', desc: '(干扰:TCP的)' },
]
let assembled = false, angle = 0, spin = 0.5, run = null, sparks = [], lit = false
const statusEl = document.getElementById('status'), runBtn = document.getElementById('run')
const slotXY = (s) => ({ x: HX() + s.fx * HW, y: HY() + s.fy * HHI })

function checkAssembled() {
  assembled = slots.every(s => s.filled); runBtn.classList.toggle('on', assembled && !run)
  if (assembled && !lit) statusEl.textContent = '拼齐了!按「运行」让查号机跑起来。'
}
function tryDrop(id, cx, cy) {
  for (const s of slots) { const p = slotXY(s)
    if (Math.hypot(cx - p.x, cy - p.y) < 58) {
      if (s.filled) { statusEl.textContent = '这个槽已经装好了。'; return }
      if (s.need === id) { s.filled = true; statusEl.textContent = `装上「${id}」。`; checkAssembled(); return }
      statusEl.textContent = `咕噜:「${id}」不是这个槽的零件——这里要「${s.need}」。`; return
    } }
}
runBtn.onclick = () => { if (assembled && !run) startRun() }
function startRun() { run = { phase: 'feed', t: 0, card: { x: HX() - HW / 2 - 40, label: '域名 www.example.com' } }; spin = 9; runBtn.classList.remove('on'); statusEl.textContent = '查号中……' }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath() }
function token(x, y, label, tint) {
  if (IMG.token.complete) { const s = 46; ctx.save(); ctx.shadowColor = tint; ctx.shadowBlur = 24; ctx.drawImage(IMG.token, x - s / 2, y - s / 2, s, s); ctx.restore() }
  const tw = ctx.measureText(label).width; ctx.fillStyle = 'rgba(20,14,8,.9)'; rr(x - tw / 2 - 8, y + 26, tw + 16, 20, 6); ctx.fill()
  ctx.fillStyle = '#ffe6b0'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, x, y + 40)
}

let last = 0
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts
  ctx.clearRect(0, 0, W, H)
  const bg = ctx.createRadialGradient(HX(), HY(), 60, HX(), HY(), W * .7); bg.addColorStop(0, '#1e160d'); bg.addColorStop(1, '#120d08'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H)
  angle += spin * dt * 2.2; spin += (0.5 - spin) * dt * 1.6
  const hx = HX(), hy = HY()

  // 外壳贴图(+ 拼齐/点亮时描一圈辉光)
  if (assembled || lit) { ctx.save(); ctx.shadowColor = lit ? '#e0a94b' : '#c9a227'; ctx.shadowBlur = lit ? 34 : 16; ctx.fillStyle = 'rgba(0,0,0,0.001)'; rr(hx - HW / 2, hy - HHI / 2, HW, HHI, 20); ctx.fill(); ctx.restore() }
  if (IMG.housing.complete) ctx.drawImage(IMG.housing, hx - HW / 2, hy - HHI / 2, HW, HHI)
  ctx.fillStyle = lit ? '#ffe0a0' : '#c9b58a'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'
  ctx.fillText('DNS 解析', hx, hy - HHI / 2 - 12)

  // 槽:填了转齿轮,空的画虚线提示
  for (const s of slots) { const p = slotXY(s)
    if (s.filled && IMG.gear.complete) { const g = 74; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((s.fx >= 0 ? 1 : -1) * angle); if (lit) { ctx.shadowColor = '#e0a94b'; ctx.shadowBlur = 16 } ctx.drawImage(IMG.gear, -g / 2, -g / 2, g, g); ctx.restore() }
    else if (!s.filled) { ctx.strokeStyle = 'rgba(255,210,120,.55)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#a08a5a'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(s.need, p.x, p.y + 52) }
  }

  // 运行流程
  if (run) { run.t += dt
    if (run.phase === 'feed') { run.card.x += (hx - run.card.x) * Math.min(1, dt * 3.4); if (Math.abs(run.card.x - hx) < 5) { run.phase = 'proc'; run.t = 0 } token(run.card.x, hy + HHI / 2 + 30, run.card.label, '#ffd98a') }
    else if (run.phase === 'proc') { spin = 9; if (Math.random() < .7) sparks.push({ x: hx + (Math.random() - .5) * 150, y: hy, vx: (Math.random() - .5) * 80, vy: -60 - Math.random() * 80, life: .55 }); if (run.t > 1.1) { run.phase = 'out'; run.t = 0; run.card = { x: hx, label: 'IP 203.0.113.5' }; lit = true } }
    else if (run.phase === 'out') { run.card.x += (hx + HW / 2 + 50 - run.card.x) * Math.min(1, dt * 2.6); token(run.card.x, hy + HHI / 2 + 30, run.card.label, '#9be29b'); if (run.t > 1.4) { run.phase = 'done'; statusEl.textContent = '域名 → IP,查号机跑通了 ✓' } }
    else token(hx + HW / 2 + 50, hy + HHI / 2 + 30, 'IP 203.0.113.5', '#9be29b')
  }
  sparks = sparks.filter(s => s.life > 0)
  for (const s of sparks) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 150 * dt; ctx.globalAlpha = Math.max(0, s.life * 1.8); ctx.fillStyle = '#ffcf6a'; ctx.beginPath(); ctx.arc(s.x, s.y, 2.6, 0, 7); ctx.fill(); ctx.globalAlpha = 1 }

  if (run && run.phase === 'done') { ctx.fillStyle = '#9be29b'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.save(); ctx.shadowColor = '#9be29b'; ctx.shadowBlur = 20; ctx.fillText('✓ 查号机跑通了', hx, hy - HHI / 2 - 40); ctx.restore() }
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)

// 零件库(带缩略图)+ 拖拽
const pills = document.getElementById('pills')
let drag = null, ghost = null
for (const p of PARTS) {
  const el = document.createElement('div'); el.className = 'pill'
  const ic = IMG[p.id] ? `<img src="./machine/${p.id === '域名' ? 'part-domain' : p.id === 'DNS服务器' ? 'part-server' : 'part-cache'}.png">` : '<div style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#8a7a5a">?</div>'
  el.innerHTML = ic + `<div><b>${p.id}</b><br><span>${p.desc}</span></div>`
  el.addEventListener('pointerdown', ev => {
    drag = p
    ghost = document.createElement('img'); ghost.className = 'ghost'
    ghost.src = IMG[p.id] ? IMG[p.id].src : ''
    ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; document.body.appendChild(ghost)
  })
  pills.appendChild(el)
}
addEventListener('pointermove', ev => { if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px' } })
addEventListener('pointerup', ev => { if (!drag) return; const d = drag; drag = null; if (ghost) { ghost.remove(); ghost = null } tryDrop(d.id, ev.clientX, ev.clientY) })

window.__fill = (id) => { const s = slots.find(s => s.need === id && !s.filled); if (s) { s.filled = true; checkAssembled() } }
window.__run = () => startRun()
window.__state = () => ({ assembled, lit, filled: slots.filter(s => s.filled).length, phase: run && run.phase })
</script>
</body>
</html>
