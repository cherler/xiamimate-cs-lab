<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TCP 握手机 · 结构完全不同</title>
<style>
  html,body{margin:0;height:100%;background:#140f0a;overflow:hidden;font-family:sans-serif}
  #c{display:block;width:100vw;height:100vh}
  #lib{position:fixed;left:0;top:0;bottom:0;width:210px;background:#1a130b;border-right:1px solid #3a2e1a;padding:14px 12px;box-sizing:border-box;z-index:5}
  #lib h3{margin:0 0 2px;color:#c9a227;font-size:15px}#lib .hint{color:#8a7a5a;font-size:11px;margin-bottom:12px}
  .pill{display:flex;align-items:center;gap:8px;background:#241a10;border:2px solid #b8863a;border-radius:10px;padding:9px 10px;margin:9px 0;color:#e8d9b8;cursor:grab;user-select:none;font-size:14px;font-weight:bold}
  .pill .n{width:26px;height:26px;border-radius:50%;background:#3a2a14;display:flex;align-items:center;justify-content:center;font-size:12px;color:#c9a227}
  #run{position:fixed;bottom:26px;left:calc(50% + 105px);transform:translateX(-50%);z-index:5;background:#3a2418;color:#6b5a3a;border:1px solid #4a3a22;border-radius:10px;padding:12px 30px;font-size:16px;font-weight:bold;cursor:not-allowed}
  #run.on{background:#c0603a;color:#150d07;cursor:pointer;box-shadow:0 4px 16px rgba(192,96,58,.5)}
  #tag{position:fixed;top:14px;left:226px;color:#c9a227;font-weight:bold;z-index:5}
  #status{position:fixed;top:40px;left:226px;color:#a08a5a;font-size:13px;z-index:5}
  .ghost{position:fixed;pointer-events:none;z-index:99;background:#2a2012;border:2px solid #c9a227;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:bold;color:#ffe6b0;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lib"><h3>握手步骤</h3><div class="hint">按顺序拖进三个槽(和查号机不一样:这是次序,不是并列)</div><div id="pills"></div></div>
<div id="tag">TCP 握手机</div>
<div id="status">按 SYN → SYN-ACK → ACK 的顺序把三步拖进槽。</div>
<button id="run">▶ 运行握手</button>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d')
let W, H, DPR = Math.min(2, devicePixelRatio || 1)
function resize() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0) }
addEventListener('resize', resize); resize()
const IMG = {}; const load = (k, s) => { const i = new Image(); i.src = s; IMG[k] = i }
load('arm', './machine/arm.png'); load('token', './machine/token.png')

const BEATS = ['SYN', 'SYN-ACK', 'ACK']
const slots = [0, 1, 2].map(i => ({ beat: BEATS[i], filled: false }))
const PARTS = [{ id: 'SYN', n: '①' }, { id: 'SYN-ACK', n: '②' }, { id: 'ACK', n: '③' }, { id: 'FIN', n: '✕' }]
let assembled = false, run = null, extend = [0, 0], clasp = 0, connected = false, sparks = []
const statusEl = document.getElementById('status'), runBtn = document.getElementById('run')
const AY = () => H * 0.4, CLAW_L = () => W / 2 - 90, CLAW_R = () => W / 2 + 90
const slotX = (i) => W / 2 - 150 + i * 150, slotY = () => H * 0.66

function checkAssembled() { assembled = slots.every(s => s.filled); runBtn.classList.toggle('on', assembled && !run); if (assembled && !connected) statusEl.textContent = '三步就位!按「运行握手」——看它和查号机多不一样。' }
function tryDrop(id, cx, cy) {
  const next = slots.findIndex(s => !s.filled)
  for (let i = 0; i < 3; i++) { if (Math.hypot(cx - slotX(i), cy - slotY()) < 56) {
    if (slots[i].filled) { statusEl.textContent = '这步已放。'; return }
    if (i !== next) { statusEl.textContent = `咕噜:握手讲顺序——先放第 ${next + 1} 步「${BEATS[next]}」。`; return }
    if (id !== BEATS[i]) { statusEl.textContent = id === 'FIN' ? '咕噜:FIN 是拆连接的,建连不用它。' : `咕噜:第 ${i + 1} 步该是「${BEATS[i]}」。`; return }
    slots[i].filled = true; statusEl.textContent = `第 ${i + 1} 步「${id}」就位。`; checkAssembled(); return
  } }
}
runBtn.onclick = () => { if (assembled && !run) startRun() }
function startRun() { run = { beat: 0, phase: 'fly', t: 0, tok: { x: CLAW_L(), dir: 1 } }; runBtn.classList.remove('on'); statusEl.textContent = '握手中……' }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath() }
function arm(side, clawX, ay) {
  const w = 430, h = w * 1024 / 1536
  ctx.save()
  if (side < 0) { ctx.translate(clawX + 40 - extend[0], ay); ctx.drawImage(IMG.arm, -20, -h / 2, w, h) }
  else { ctx.translate(clawX - 40 + extend[1], ay); ctx.scale(-1, 1); ctx.drawImage(IMG.arm, -20, -h / 2, w, h) }
  ctx.restore()
}
function token(x, y, label, tint) {
  if (IMG.token.complete) { const s = 44; ctx.save(); ctx.shadowColor = tint; ctx.shadowBlur = 22; ctx.drawImage(IMG.token, x - s / 2, y - s / 2, s, s); ctx.restore() }
  if (label) { const tw = ctx.measureText(label).width; ctx.fillStyle = 'rgba(20,14,8,.9)'; rr(x - tw / 2 - 8, y - 44, tw + 16, 20, 6); ctx.fill(); ctx.fillStyle = '#ffe6b0'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, x, y - 30) }
}

let last = 0
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts
  ctx.clearRect(0, 0, W, H)
  const bg = ctx.createRadialGradient(W / 2, AY(), 60, W / 2, AY(), W * .7); bg.addColorStop(0, '#1e160d'); bg.addColorStop(1, '#120d08'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H)
  extend[0] += (0 - extend[0]) * dt * 6; extend[1] += (0 - extend[1]) * dt * 6

  // 标题:客户端 / 服务器
  ctx.fillStyle = '#c9b58a'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'
  ctx.fillText('客户端', W * 0.24, AY() - 130); ctx.fillText('服务器', W * 0.76, AY() - 130)

  // 中间通道
  const gy = AY(); ctx.strokeStyle = connected ? '#9be29b' : '#3a2e1a'; ctx.lineWidth = connected ? 8 : 6; ctx.setLineDash(connected ? [] : [10, 10])
  if (connected) { ctx.shadowColor = '#9be29b'; ctx.shadowBlur = 18 }
  ctx.beginPath(); ctx.moveTo(CLAW_L() + clasp, gy); ctx.lineTo(CLAW_R() - clasp, gy); ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0

  // 两只手臂(对着)
  if (IMG.arm.complete) { arm(-1, CLAW_L() + clasp, gy); arm(1, CLAW_R() - clasp, gy) }

  // 顺序槽
  for (let i = 0; i < 3; i++) { const x = slotX(i), y = slotY()
    if (i < 2) { ctx.strokeStyle = '#5a4a2a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 42, y); ctx.lineTo(x + 108, y); ctx.stroke(); ctx.fillStyle = '#5a4a2a'; ctx.fillText('▶', x + 96, y + 4) }
    ctx.fillStyle = slots[i].filled ? '#3a2c16' : '#1a130b'; ctx.strokeStyle = slots[i].filled ? '#e0a94b' : '#5a4a2a'; ctx.lineWidth = 2
    if (!slots[i].filled) ctx.setLineDash([6, 6]); rr(x - 40, y - 22, 84, 44, 8); ctx.fill(); ctx.stroke(); ctx.setLineDash([])
    ctx.fillStyle = slots[i].filled ? '#ffe0a0' : '#6b5a3a'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(slots[i].beat, x + 2, y + 4)
    ctx.fillStyle = '#8a7a5a'; ctx.font = '10px sans-serif'; ctx.fillText('第' + (i + 1) + '拍', x + 2, y - 30)
  }

  // 握手运行:令牌来回三拍
  if (run) { run.t += dt
    if (run.phase === 'fly') {
      const from = run.tok.dir > 0 ? CLAW_L() : CLAW_R(), to = run.tok.dir > 0 ? CLAW_R() : CLAW_L()
      run.tok.x += (to - run.tok.x) * Math.min(1, dt * 4)
      extend[run.tok.dir > 0 ? 0 : 1] = 18
      if (Math.random() < .3) sparks.push({ x: run.tok.x, y: gy, vx: (Math.random() - .5) * 60, vy: -40 - Math.random() * 50, life: .5 })
      token(run.tok.x, gy, BEATS[run.beat], '#ffd98a')
      if (Math.abs(run.tok.x - to) < 6) { run.beat++; if (run.beat >= 3) { run.phase = 'clasp'; run.t = 0 } else { run.tok.dir *= -1 } }
    } else if (run.phase === 'clasp') {
      clasp += (72 - clasp) * Math.min(1, dt * 3)
      if (run.t > 0.5 && !connected) { connected = true; statusEl.textContent = '三拍握完,通道接通 ✓ —— 两只手咬合。这台机器和查号机,一眼就不是换标签。' }
      if (run.t > 0.5) { if (Math.random() < .5) sparks.push({ x: W / 2 + (Math.random() - .5) * 60, y: gy, vx: (Math.random() - .5) * 50, vy: -50 - Math.random() * 40, life: .5, c: '#9be29b' }) }
    }
  }
  sparks = sparks.filter(s => s.life > 0)
  for (const s of sparks) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 150 * dt; ctx.globalAlpha = Math.max(0, s.life * 1.8); ctx.fillStyle = s.c || '#ffcf6a'; ctx.beginPath(); ctx.arc(s.x, s.y, 2.6, 0, 7); ctx.fill(); ctx.globalAlpha = 1 }

  if (connected) { ctx.fillStyle = '#9be29b'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.save(); ctx.shadowColor = '#9be29b'; ctx.shadowBlur = 20; ctx.fillText('✓ 连接建立', W / 2, AY() - 90); ctx.restore() }
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)

const pills = document.getElementById('pills')
let drag = null, ghost = null
for (const p of PARTS) { const el = document.createElement('div'); el.className = 'pill'; el.innerHTML = `<span class="n">${p.n}</span>${p.id}`
  el.addEventListener('pointerdown', ev => { drag = p; ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.textContent = p.id; ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; document.body.appendChild(ghost) }); pills.appendChild(el) }
addEventListener('pointermove', ev => { if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px' } })
addEventListener('pointerup', ev => { if (!drag) return; const d = drag; drag = null; if (ghost) { ghost.remove(); ghost = null } tryDrop(d.id, ev.clientX, ev.clientY) })

window.__fill = () => { const s = slots.find(s => !s.filled); if (s) { s.filled = true; checkAssembled() } }
window.__run = () => startRun()
window.__state = () => ({ assembled, connected, filled: slots.filter(s => s.filled).length, phase: run && run.phase })
</script>
</body>
</html>
