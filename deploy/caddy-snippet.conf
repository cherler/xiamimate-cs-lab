# 虾米做实验：加到线上 /etc/caddy/Caddyfile 的 `:8080 { }` 块里。
# 形态与 /atlas、/stocks 一致（见 xiamimate-ai-atlas/deploy/caddy-snippet.conf）。
#
# **顺序要紧**：必须排在主站的 `handle { ... }` 兜底之前，
# 否则 /lab 的请求会全部落到主站静态页。
#
# 加完执行：
#   sudo caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy

    # ── 虾米做实验（计算机专业课交互仿真） ──────────────────────────
    # 账号与学习进度直接打主站的 /v1/*（同源同 Cookie）。
    #
    # AI 学伴（出题/答疑/复习）有自己的 Node 进程（server/index.ts，:8300）：
    # 出题要 import 内核跑 trace、答案由引擎钉死，所以它必须是进程、不是静态文件。
    # 计费仍走主站（llm.ts 里把 xm_session Cookie 转发到 /v1/credits/*）。
    # **这条 /lab/ai/* 必须排在下面 handle_path /lab/* 静态兜底之前**，否则会被当成静态文件 404。
    # 与本地 scripts/local-gateway.mjs 的规则一一对应 —— 改一边要改另一边。
    handle /lab/ai/* {
        reverse_proxy 127.0.0.1:8300
    }

    # ── 两个游戏（monorepo 的 games/algo-cards、games/xiami-world）──────────
    # 各自 `vite build`（base=/lab/cards/、/lab/world/），产物静态托管。
    # **同 /lab/ai/*：必须排在下面 handle_path /lab/* 之前**，否则游戏请求会落到本仓
    # 静态根 404。deploy 把 games/algo-cards/dist、games/xiami-world/dist 分别摆到
    # /srv/xiamimate/lab-cards/current、/srv/xiamimate/lab-world/current。
    @cardsRoot path /lab/cards
    redir @cardsRoot /lab/cards/ 308
    handle_path /lab/cards/* {
        root * /srv/xiamimate/lab-cards/current
        encode zstd gzip
        try_files {path} {path}/
        file_server
    }
    @worldRoot path /lab/world
    redir @worldRoot /lab/world/ 308
    handle_path /lab/world/* {
        root * /srv/xiamimate/lab-world/current
        encode zstd gzip
        try_files {path} {path}/
        file_server
    }

    # handle_path 剥掉 /lab 前缀；Vite 那边构建时设 `VITE_BASE=/lab/`，
    # **两者是配套的一对**：HTML 里的资源链接带 /lab，文件按根目录摆。
    @labRoot path /lab
    redir @labRoot /lab/ 308

    handle_path /lab/* {
        root * /srv/xiamimate/lab/current
        encode zstd gzip
        # ⚠️ **不要 `/index.html` 兜底。**
        #
        # 那是 SPA 的写法，而本仓只有一个页面、没有前端路由 —— 一条真路由都不需要兜。
        # 带上它的后果是**任何不存在的路径都返回 200 + 首页 HTML**：
        # `/lab/assets/根本不存在.js` 返回 200、content-type: text/html，
        # 浏览器把 HTML 当 JS 解析，控制台一句 `Unexpected token '<'`，
        # 而页面看上去只是"没渲染"。/atlas 的同一份文件里记着这个坑，别再踩一次。
        #
        # 找不到就 404，交给站级 handle_errors。
        try_files {path} {path}/
        file_server
    }
