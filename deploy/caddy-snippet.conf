# 虾米做实验：加到线上 /etc/caddy/Caddyfile 的 `:8080 { }` 块里。
# 形态与 /atlas、/stocks 一致（见 xiamimate-ai-atlas/deploy/caddy-snippet.conf）。
#
# **顺序要紧**：必须排在主站的 `handle { ... }` 兜底之前，
# 否则 /cslab 的请求会全部落到主站静态页。
#
# 加完执行：
#   sudo caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy

    # ── 虾米做实验（计算机专业课交互仿真） ──────────────────────────
    # 账号与学习进度直接打主站的 /v1/*（同源同 Cookie）。
    #
    # AI 学伴（出题/答疑/复习）有自己的 Node 进程（server/index.ts，:8300）：
    # 出题要 import 内核跑 trace、答案由引擎钉死，所以它必须是进程、不是静态文件。
    # 计费仍走主站（llm.ts 里把 xm_session Cookie 转发到 /v1/credits/*）。
    # **这条 /cslab/ai/* 必须排在下面 handle_path /cslab/* 静态兜底之前**，否则会被当成静态文件 404。
    # 与本地 scripts/local-gateway.mjs 的规则一一对应 —— 改一边要改另一边。
    handle /cslab/ai/* {
        reverse_proxy 127.0.0.1:8300
    }

    # ── 算法卡牌（monorepo 的 games/algo-cards）──────────────────────────
    # `vite build`（base=/cslab/cards/），产物静态托管。
    # **同 /cslab/ai/*：必须排在下面 handle_path /cslab/* 之前**，否则游戏请求会落到本仓
    # 静态根 404。deploy 把 games/algo-cards/dist 摆到 /srv/xiamimate/cslab-cards/current。
    #
    # ⚠️ 这里原来还有一条 /cslab/world/*（探索游戏，games/xiami-world）。
    # **2026-09-10 用户拍板从虾米CS课堂去掉：完成度太差。** 代码留在仓里、能单独跑，
    # 只是不再挂到 /cslab 下。真要下线线上那份，记得连 /srv/xiamimate/cslab-world/ 一起清。
    @cardsRoot path /cslab/cards
    redir @cardsRoot /cslab/cards/ 308
    handle_path /cslab/cards/* {
        root * /srv/xiamimate/cslab-cards/current
        encode zstd gzip
        try_files {path} {path}/
        file_server
    }

    # ── Transformer 图解的两个入口（experiments/，不需要构建）─────────────
    # `/cslab/explainer` 是门厅页（experiments/explainer-hub/），
    # `/cslab/explainer-live` 是浏览器里跑真模型那份（experiments/qwen-browser/）。
    #
    # ⚠️ **这两条 2026-09-10 才补上，之前只有 dev 有。**
    # dev 下它们由 web/vite.config.ts 的 subappsPlugin 中间件伺候 ——
    # 那是 `configureServer` 钩子，**只在 dev server 里跑，构建产物里没有**。
    # 所以本地点得开、上线 404，而且 404 的样子跟"路由没配"一模一样。
    # 同 cards/world：**必须排在下面 handle_path /cslab/* 静态兜底之前**。
    @explainerLiveRoot path /cslab/explainer-live
    redir @explainerLiveRoot /cslab/explainer-live/ 308
    handle_path /cslab/explainer-live/* {
        root * /srv/xiamimate/cslab-explainer-live/current
        encode zstd gzip
        try_files {path} {path}/
        file_server
    }
    @explainerRoot path /cslab/explainer
    redir @explainerRoot /cslab/explainer/ 308
    handle_path /cslab/explainer/* {
        root * /srv/xiamimate/cslab-explainer/current
        encode zstd gzip
        try_files {path} {path}/
        file_server
    }

    # handle_path 剥掉 /cslab 前缀；Vite 那边构建时设 `VITE_BASE=/cslab/`，
    # **两者是配套的一对**：HTML 里的资源链接带 /cslab，文件按根目录摆。
    @cslabRoot path /cslab
    redir @cslabRoot /cslab/ 308

    handle_path /cslab/* {
        root * /srv/xiamimate/cslab/current
        encode zstd gzip
        # ⚠️ **不要 `/index.html` 兜底。**
        #
        # 那是 SPA 的写法，而本仓只有一个页面、没有前端路由 —— 一条真路由都不需要兜。
        # 带上它的后果是**任何不存在的路径都返回 200 + 首页 HTML**：
        # `/cslab/assets/根本不存在.js` 返回 200、content-type: text/html，
        # 浏览器把 HTML 当 JS 解析，控制台一句 `Unexpected token '<'`，
        # 而页面看上去只是"没渲染"。/atlas 的同一份文件里记着这个坑，别再踩一次。
        #
        # 找不到就 404，交给站级 handle_errors。
        try_files {path} {path}/
        file_server
    }
